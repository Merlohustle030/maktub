      const was = this.locked;
      this.locked = document.pointerLockElement === cv;
      if (was && !this.locked && (G.mode === 'play' || G.mode === 'cine') && !G.paused && !G.noPauseOnUnlock) Notebook.open();
    });
  },
  key(a) { return !!(this.down[a] || this.virt[a]); },
  pressed(a) { return !!this.edge[a]; },
  confirm() { return !!(this.edge.confirm || this.edge.click || this.edge.vconfirm); },
  axis() {
    let x = (this.key('right') ? 1 : 0) - (this.key('left') ? 1 : 0), y = (this.key('up') ? 1 : 0) - (this.key('down') ? 1 : 0);
    x += this.stick.x; y += this.stick.y;
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    return { x, y };
  },
  endFrame() { this.edge = {}; this.dx = 0; this.dy = 0; },
  releaseLock() { if (document.pointerLockElement && document.exitPointerLock) { G.noPauseOnUnlock = true; document.exitPointerLock(); setTimeout(() => { G.noPauseOnUnlock = false; }, 100); } },
};

// ---------- Auswahl / Ungesagt ----------
const Choice = {
  // options: [{text, unsaid?:bool, unlocked?:bool, key?}]  -> index der gewählten (nur wählbare)
  async pick(options, o = {}) {
    if (G.skipping) { const i = options.findIndex((x) => !x.unsaid); return Math.max(0, i); }
    const box = $('#choices'); box.innerHTML = '';
    const items = options.map((opt, i) => {
      const d = h('div', 'choice' + (opt.unsaid ? ' unsaid' : '') + (opt.unlocked ? ' unlocked' : ''));
      d.innerHTML = (o.numbers ? `<span class="k">${i + 1}</span>` : '') + opt.text;
      d.style.animationDelay = (o.stagger === false ? 0 : i * 0.18) + 's';
      box.appendChild(d); return d;
    });
    let sel = Math.max(0, options.findIndex((x) => !x.unsaid));
    const mark = () => items.forEach((d, i) => d.classList.toggle('sel', i === sel));
    mark();
    let result = -1;
    const tryPick = (i) => {
      if (options[i].unsaid) { items[i].classList.remove('shake'); void items[i].offsetWidth; items[i].classList.add('shake'); Snd.deny(); Snd.heartSet(null, 0.7); return; }
      result = i; Snd.uiClick();
    };
    items.forEach((d, i) => { d.addEventListener('mouseenter', () => { sel = i; mark(); Snd.uiHover(); }); d.addEventListener('click', () => tryPick(i)); });
    await sleep(o.delay != null ? o.delay : 0.5);
    await until(() => {
      if (Input.pressed('up') && sel > 0) { sel--; mark(); Snd.uiHover(); }
      if (Input.pressed('down') && sel < options.length - 1) { sel++; mark(); Snd.uiHover(); }
      for (let i = 0; i < 4; i++) if (Input.pressed('n' + (i + 1)) && i < options.length) { sel = i; mark(); tryPick(i); }
      if (Input.pressed('confirm') && result < 0) tryPick(sel);
      return result >= 0;
    });
    items.forEach((d, i) => { if (i !== result) d.style.opacity = 0; d.style.transition = 'opacity .5s'; });
    await sleep(0.45);
    box.innerHTML = '';
    return result;
  },
  // Das Ungesagte: sagbar ist nur eine Zeile, die anderen sind verblasst und durchgestrichen (im Finale wählbar)
  async unsaid(say, unsaid, o = {}) {
    const opts = [...unsaid.map((t) => ({ text: t, unsaid: !o.unlock, unlocked: !!o.unlock })), { text: say }];
    // gesagte Zeile zuerst (unten), Ungesagtes darüber
    const idx = await this.pick(opts, { stagger: true, delay: 0.9 });
    return idx === opts.length - 1 ? -1 : idx;
  },
};

// ---------- Einstellungen ----------
function applySettings() {
  const s = G.settings;
  if (AUD) AUD.setVolumes(s.musicVol, s.sfxVol);
  document.documentElement.style.setProperty('--sub-scale', [0.85, 1, 1.25][s.subSize] || 1);
  Store.set('settings', s);
}
function buildSettings(box) {
  const s = G.settings;
  const slider = (id, label, val) => `<div class="row"><label>${label}</label><input type="range" min="0" max="1" step="0.01" value="${val}" data-k="${id}"></div>`;
  const seg = (id, label, opts, cur) => `<div class="row"><label>${label}</label><div class="seg" data-k="${id}">${opts.map(([v, t]) => `<button data-v="${v}" class="${String(cur) === String(v) ? 'on' : ''}">${t}</button>`).join('')}</div></div>`;
  box.innerHTML = slider('musicVol', 'Musik', s.musicVol) + slider('sfxVol', 'Klang', s.sfxVol)
    + seg('quality', 'Grafik', [['auto', 'Auto'], ['high', 'Hoch'], ['mid', 'Mittel'], ['low', 'Niedrig']], s.quality)
    + seg('grain', 'Filmkorn', [[1, 'An'], [0, 'Aus']], s.grain ? 1 : 0)
    + seg('subSize', 'Untertitel', [[0, 'Klein'], [1, 'Mittel'], [2, 'Groß']], s.subSize);
  $$('input[type=range]', box).forEach((inp) => {
    const upd = () => { inp.style.setProperty('--p', inp.value * 100 + '%'); };
    upd();
    inp.addEventListener('input', () => { s[inp.dataset.k] = +inp.value; upd(); applySettings(); });
    inp.addEventListener('change', () => Snd.uiHover());
  });
  $$('.seg', box).forEach((sg) => {
    $$('button', sg).forEach((b) => b.addEventListener('click', () => {
      const k = sg.dataset.k; let v = b.dataset.v;
      $$('button', sg).forEach((x) => x.classList.toggle('on', x === b)); b.blur();
      Snd.uiClick();
      if (k === 'quality') { s.quality = v; GFX.setQuality(v); }
      else if (k === 'grain') s.grain = v === '1';
      else if (k === 'subSize') s.subSize = +v;
      applySettings();
    }));
  });
}

    btn('.tb.n', () => { Input.edge.confirm = true; Input.virt.confirm = true; }, () => { Input.virt.confirm = false; });
    // Wischen aufs Bild = Kamera
    let last = null;
    const cv = $('#gl');
    cv.addEventListener('touchstart', (e) => { last = e.touches[0]; }, { passive: true });
    cv.addEventListener('touchmove', (e) => { const t = e.touches[0]; if (last) { Input.dx += (t.clientX - last.clientX) * 1.4; Input.dy += (t.clientY - last.clientY) * 1.4; Input.mx = clamp(Input.mx + (t.clientX - last.clientX) / 200, -1, 1); } last = t; }, { passive: true });
    cv.addEventListener('touchend', () => { Input.edge.click = true; last = null; }, { passive: true });
  },
};

// Figuren: prozedurales Low-Poly-Rig (Gelenk-Hierarchie), Pose-System, Gehzyklus, Blick, Blinzeln.
// Konvention: Figur blickt nach +Z, links = +X. Winkel in Grad.
//   arm  [beugen vor, abspreizen, drehen]   fore = Ellbogen   leg {flex, abd, knee, foot}
//   spine.lean > 0 = Oberkörper nach vorn.   head.nod > 0 = Kopf nickt nach unten, turn > 0 = nach links, tilt > 0 = zur rechten Schulter
// =====================================================================
const JOINTS = ['hips', 'spine', 'chest', 'neck', 'head', 'armL', 'foreL', 'handL', 'armR', 'foreR', 'handR', 'legL', 'shinL', 'footL', 'legR', 'shinR', 'footR'];

function mkPose(o = {}) {
  const P = { rootY: o.y || 0, rootZ: o.z || 0, rootX: o.x || 0 };
  P.hips = [o.hipTilt || 0, o.hipTwist || 0, o.hipSide || 0];
  P.spine = [o.lean || 0, o.twist || 0, o.side || 0];
  P.chest = [o.chestLean || 0, o.chestTwist || 0, o.chestSide || 0];
  P.neck = [o.neckNod || 0, o.neckTurn || 0, o.neckTilt || 0];
  P.head = [o.nod || 0, o.turn || 0, o.tilt || 0];
  for (const s of ['L', 'R']) {
    const sg = s === 'L' ? 1 : -1, a = o[s] || {}, arm = a.arm || [3, 6, 0], l = o['leg' + s] || o.leg || {};
    P['arm' + s] = [-arm[0], sg * (arm[2] || 0), sg * arm[1]];
    P['fore' + s] = [-(a.fore != null ? a.fore : 12), sg * (a.foreTwist || 0), 0];
    P['hand' + s] = [-(a.hand || 0), 0, sg * (a.handSide || 0)];
    P['leg' + s] = [-(l.flex || 0), sg * (l.twist || 0), sg * (l.abd != null ? l.abd : 2)];
    P['shin' + s] = [l.knee || 0, 0, 0];
    P['foot' + s] = [l.foot || 0, 0, 0];
  }
  return P;
}

const _tmpV = new THREE.Vector3();
const BODY = { hipY: 0.97, thigh: 0.43, shin: 0.42, spineH: 0.22, chestH: 0.29, neckH: 0.07, head: 0.11 };

class Character {
  constructor(name, opt = {}) {
    this.name = name; this.opt = opt;
    this.root = new THREE.Group(); this.root.name = 'char_' + name;
    this.j = {}; this.mats = [];
    this.cur = mkPose({ lean: 1.5 });
    this.pose = POSES.stand; this.overlay = null;
    this.walkAmt = 0; this.phase = 0; this.speed = 0; this.yaw = 0;
    this.gait = Object.assign({ stride: 0.78, leg: 30, arm: 0.34, knee: 42, bob: 0.02, lean: 3, sway: 2.2 }, opt.gait || {});
    this.look = { target: null, w: 0, yaw: 0, pitch: 0 };
    this.blinkT = 2 + Math.random() * 3; this.blink = 0;
    this.breath = Math.random() * 6;
    this.holds = {};
    this.moveT = null; this.moveRes = null; this.moveSpeed = 1.4;
    this.gaze = { x: 0, y: 0 };
    this.k = 9; this.poseK = 7;
    this.dyn = {};

  joint(name, parent, x, y, z) {
    const g = new THREE.Group(); g.name = name; g.position.set(x, y, z);
    (parent || this.root).add(g); this.j[name] = g; return g;
  }
  addMesh(jn, mb, mat) {
    const m = mb.mesh(mat, { cast: true, receive: true }); this.j[jn].add(m); return m;
  }
  setPose(p, k) {
    this.pose = typeof p === 'string' ? (POSES[p] || POSES.stand) : p;
    if (k != null) this.poseK = k;
    return this;
  }
  // Pose sofort übernehmen (ohne Übergang) – für Schnitte
  snapPose() {
    const b = this.pose;
    for (const jn of JOINTS) this.cur[jn] = b[jn].slice();
    this.cur.rootX = b.rootX; this.cur.rootY = b.rootY; this.cur.rootZ = b.rootZ;
    for (const jn of JOINTS) { const o = this.j[jn], c = this.cur[jn]; if (o) o.rotation.set(c[0] * DEG, c[1] * DEG, c[2] * DEG); }
    this.j.hips.position.set(b.rootX, (BODY.hipY + b.rootY) * (this.opt.s || 1), b.rootZ);
    return this;
  }
  lookAt(v, w = 1) { this.look.target = v; this.look.w = v ? w : 0; return this; }
  faceYaw(y) { this.yaw = y; this.root.rotation.y = y; }
  faceTo(x, z) { this.yaw = Math.atan2(x - this.root.position.x, z - this.root.position.z); this.root.rotation.y = this.yaw; }
  place(x, y, z, yaw) { this.root.position.set(x, y, z); if (yaw != null) this.faceYaw(yaw); return this; }
  hold(name, on = true) {
    const m = this.holds[name]; if (m) m.visible = on;
    const side = { notebook: 'L', sketch: 'L', phone: 'R', pencil: 'R' }[name];
    if (side) this['hold' + side] = on;
    return this;
  }
  // Skript-Bewegung: gerade Linie zum Ziel (ohne Kollision), gibt Promise zurück
  walkTo(x, z, { speed = 1.35, face = null } = {}) {
    return new Promise((res, rej) => {
      if (G.skipping) { this.root.position.x = x; this.root.position.z = z; if (face != null) this.faceYaw(face); res(); return; }

  }
  finishMove() {

    this.moveT = null; if (this.moveRes) { const f = this.moveRes; this.moveRes = null; f(); }
  }

    for (const jn of JOINTS) { const b = base[jn], o = ov && ov[jn]; T[jn] = [b[0] + (o ? o[0] : 0), b[1] + (o ? o[1] : 0), b[2] + (o ? o[2] : 0)]; }
    let rootY = base.rootY + (ov ? ov.rootY || 0 : 0), rootZ = base.rootZ + (ov ? ov.rootZ || 0 : 0), rootX = base.rootX;
    this.breath += dt * 1.25;
    const br = Math.sin(this.breath) * (1 - wa * 0.6);
    T.chest[0] += br * 0.9; T.spine[0] += br * 0.4; T.neck[0] -= br * 0.5; T.armL[2] += br * 0.8; T.armR[2] -= br * 0.8;
    if (wa > 0.01) {
      const s = Math.sin(ph), s2 = Math.sin(ph + Math.PI), cs = Math.cos(ph), cs2 = Math.cos(ph + Math.PI);
      const A = g.leg * wa;
      T.legL[0] += -A * s; T.legR[0] += -A * s2;
      T.shinL[0] += g.knee * wa * Math.max(0, cs); T.shinR[0] += g.knee * wa * Math.max(0, cs2);
      T.footL[0] += -8 * wa * s + 6 * wa * Math.max(0, cs); T.footR[0] += -8 * wa * s2 + 6 * wa * Math.max(0, cs2);
      const ar = g.arm * A;
      T.armL[0] += ar * s * (this.holdL ? 0 : 1); T.armR[0] += ar * s2 * (this.holdR ? 0 : 1);
      T.spine[1] += g.sway * s * wa; T.chest[1] -= g.sway * 1.2 * s * wa; T.hips[1] -= g.sway * s * wa * 0.8;
      T.spine[0] += g.lean * wa; T.hips[2] += g.sway * 0.6 * cs * wa;
      rootY += -g.bob * (0.5 - 0.5 * Math.cos(2 * ph)) * wa;
    }
    // Blick: Kopf + Nacken + Augen
    const L = this.look; let gx = 0, gy = 0;
    if (L.target && L.w > 0.01) {
      this.j.head.getWorldPosition(_tmpV);
      const dx = L.target.x - _tmpV.x, dy = L.target.y - _tmpV.y, dz = L.target.z - _tmpV.z;
      let yawT = wrapAngle(Math.atan2(dx, dz) - this.yaw), pitT = Math.atan2(-dy, Math.hypot(dx, dz));
      const yc = clamp(yawT, -1.25, 1.25), pc = clamp(pitT, -0.6, 0.5);
      L.yaw = damp(L.yaw, yc * L.w, 7, dt); L.pitch = damp(L.pitch, pc * L.w, 7, dt);
      gx = clamp((yawT - yc) * 0.4 + (yc - L.yaw) * 0.6, -0.5, 0.5); gy = clamp(-(pitT - pc) * 0.4, -0.4, 0.4);
    } else { L.yaw = damp(L.yaw, 0, 5, dt); L.pitch = damp(L.pitch, 0, 5, dt); }
    T.head[1] += L.yaw / DEG * 0.65; T.neck[1] += L.yaw / DEG * 0.35; T.head[0] += L.pitch / DEG * 0.7; T.neck[0] += L.pitch / DEG * 0.3;
    this.gaze.x = damp(this.gaze.x, gx, 10, dt); this.gaze.y = damp(this.gaze.y, gy, 10, dt);

    this.blinkT -= dt;

    if (this.blink > 0) this.blink = Math.max(0, this.blink - dt * 7);
    // --- glätten und anwenden ---
    const kk = this.poseK;

      cc[0] += (t[0] - cc[0]) * f; cc[1] += (t[1] - cc[1]) * f; cc[2] += (t[2] - cc[2]) * f;
      const o = this.j[jn]; if (o) o.rotation.set(cc[0] * DEG, cc[1] * DEG, cc[2] * DEG);
    }
    c.rootY = (c.rootY || 0) + (rootY - (c.rootY || 0)) * (1 - Math.exp(-kk * dt));
    c.rootZ = (c.rootZ || 0) + (rootZ - (c.rootZ || 0)) * (1 - Math.exp(-kk * dt));
    c.rootX = (c.rootX || 0) + (rootX - (c.rootX || 0)) * (1 - Math.exp(-kk * dt));
    this.j.hips.position.set(c.rootX, (BODY.hipY + c.rootY) * (this.opt.s || 1), c.rootZ);
    if (this.eyes) {
      const bl = this.blink > 0 ? 1 - Math.abs(this.blink * 2 - 1) : 0;
      for (const e of this.eyes) { e.scale.y = e.userData.sy * (1 - bl * 0.92); e.position.x = e.userData.x + this.gaze.x * 0.014; e.position.y = e.userData.y + this.gaze.y * 0.01; }
      if (this.whites) for (const w of this.whites) w.scale.y = w.userData.sy * (1 - bl * 0.92);
    }

    if (this.mouth) {
      this.talk = Math.max(0, (this.talk || 0) - dt);
      const open = this.talk > 0 ? (0.3 + 0.7 * Math.abs(Math.sin(G.t * 9.2 + this.breath))) * (0.65 + 0.35 * Math.sin(G.t * 2.7 + this.breath * 2)) : 0;
      this.mouth.scale.y = this.mouth.userData.sy * (1 + open * 5.5); this.mouth.scale.x = this.mouth.userData.sx * (1 - open * 0.18);
    }
    if (this.onUpdate) this.onUpdate(dt);
  }
  // Farbwerte der Figur-Materialien (Maske: bleibt im Fokus in Farbe)
  setMask(v) { for (const m of this.mats) if (m.userData.mask) m.userData.mask.value = v; }
  setRim(v) { for (const m of this.mats) if (m.userData.rim) m.userData.rim.value = v; }
}

const SKIN = { mirza: 0xb98a67, nour: 0xc99a74, nena: 0xd0a887, child: 0xc59470, pale: 0xe2b99a, tan: 0xa87850, dark: 0x7a5238, olive: 0xbf9470 };

function humanoid(name, o) {

const Game = {
  chapterIdx: -1, running: 0, started: false,
  async fade(to, dur = 0.8, col) { if (col) FX.fadeCol = col; await tween(FX, { fade: to }, dur, 'inOutSine'); },
  async loadWorld(name, o = {}) {
    if (G.world) G.world.onLeave();
    const old = G.world;
    const W = new WORLDS[name](o);
    await W.build(o);
    G.world = W; curScene = W.scene;

    if (old) {
      if (Player.ch.root.parent === old.scene) old.scene.remove(Player.ch.root);   // gemeinsame Spielerfigur nicht mit entsorgen
      old.dispose();
    }
    if (W.noPlayer) { if (Player.ch.root.parent) Player.ch.root.parent.remove(Player.ch.root); }
    else Player.enter(W, W.spawn.x, W.spawn.z, W.spawn.yaw);
    Cam.gameplay();

  },
  // Sicheres, sauberes Verlassen einer laufenden Story (Hauptmenü)
  async toMenu() {
    this.running++;
    G.sched.abort(); if (G.world) for (const c of G.world.chars) if (c.abortMove) c.abortMove();
    Cine.active = false; Cine.skipping = false; G.skipping = false; Notebook.close(true);
    Sub.clear(); $('#choices').innerHTML = ''; Phone.hide(); Title.black(false); Ov.show && $('#overlay-text .ov').classList.remove('on');
    Focus.allowed = false; G.focus = 0; FX.focus = 0; FX.water = 0; FX.flash = 0; G.slow = 1; Snd.heartStop(); Snd.worldFilter(20000, 0.2); Snd.ambClear(1.5);

    Input.releaseLock(); UI.hud(false); $('#touch').classList.add('hidden');
    await this.fade(1, 0.7, [0, 0, 0]);
    G.mode = 'menu'; G.paused = false;
    Mus.play(CUES.menu, { mood: 'main', fadeOut: 1.5 });

    await this.fade(0, 1.6);

  async newGame() {
    Panels.closeAll();
    this.startChapter(0);
  },
  async startChapter(i) {
    const my = ++this.running;
    G.sched.abort(); G.mode = 'title';
    if (G.world) for (const c of G.world.chars) if (c.abortMove) c.abortMove();

    Store.set('progress', { chapter: i });

      if (my !== this.running) return;

      if (!c.ready) break;
      this.chapterIdx = k;
      G.chapterLabel = c.num ? `Kapitel ${c.num}` : c.title;
      Store.set('progress', { chapter: k });
      UI.hud(false);

    await this.toMenu();
  },
  showHud() { UI.hud(true); },
};

const DUST_VS = `
attribute float aSeed; uniform float uTime; uniform float uSize; uniform vec3 uBox; uniform vec3 uCenter; uniform float uPx;

// Skyline-Generator + Hauptmenü-Dach im Sonnenuntergang (auch für Party & Finale nutzbar)
// =====================================================================
const CITY_COLORS = [0xc8a98a, 0xb98f78, 0xa9927e, 0x9a8a80, 0xb0a08e, 0x8a5a48, 0xc9b48f, 0x9d8f9a, 0xb69a86];
const CITY_MODERN = [0x6a7a8a, 0x5a6878, 0x7a8896, 0x4a5868];

// Baut Häuserringe. o: {rMin,rMax,count,angA,angB (Winkelbereich um +Z gemessen, rad), hMin,hMax, litP, seed, modernP}
function buildSkyline(o) {
  const rng = new RNG(o.seed || 5);
  const body = new MB((o.seed || 5) + 1), glow = new MB(9), win = new MB(10);
  body.jit = 0.025; win.jit = 0.03;
  const litP = o.litP != null ? o.litP : 0.3;
  for (let i = 0; i < o.count; i++) {
    const a = rng.range(o.angA, o.angB), r = rng.range(o.rMin, o.rMax);
    const cx = Math.sin(a) * r + (o.cx || 0), cz = -Math.cos(a) * r + (o.cz || 0);
    const modern = rng.chance(o.modernP != null ? o.modernP : 0.15);
    const w = rng.range(8, 20), d = rng.range(8, 16);
    let h = modern ? rng.range(o.hMax * 0.7, o.hMax * 1.3) : rng.range(o.hMin, o.hMax);
    if (o.gapA != null && Math.abs(a - o.gapA) < o.gapW) h = Math.min(h, o.gapH);
    const col = modern ? rng.pick(CITY_MODERN) : rng.pick(CITY_COLORS);
    const ry = a + rng.range(-0.25, 0.25);
    const y0 = o.y0 != null ? o.y0 : -1;
    body.box(w, h - y0, d, cx, y0, cz, col, { ry, grad: [0.62, 1.04] });
    // Dach: Giebel/Mansarde oder Flachdach mit Kanten und Aufbauten
    if (!modern && rng.chance(0.6)) { body.gable(w * 0.98, d * 0.98, rng.range(3, 6), cx, h, cz, rng.pick([0x7a4a3e, 0x5a4a52, 0x8a5a44]), { ry: ry + (rng.chance(0.5) ? Math.PI / 2 : 0) }); }
    else { body.box(w + 0.4, 0.5, d + 0.4, cx, h, cz, mixHex(col, 0x000000, 0.25), { ry }); if (rng.chance(0.5)) body.box(rng.range(1.5, 3), rng.range(1.2, 3), rng.range(1.5, 3), cx + rng.range(-w / 3, w / 3), h + 0.5, cz + rng.range(-d / 3, d / 3), 0x5a5a60, { ry }); }
    if (rng.chance(0.5)) body.box(0.9, rng.range(2.5, 5), 0.9, cx + rng.range(-w / 3, w / 3), h + 1, cz + rng.range(-d / 3, d / 3), 0x6a4a40, { ry });   // Schornstein
    if (modern && rng.chance(0.5)) body.box(0.3, rng.range(6, 14), 0.3, cx, h + 0.5, cz, 0x333338);                                        // Antenne
    // Fenster nur auf den zur Mitte zeigenden Flächen
    const toC = [-Math.sin(a), Math.cos(a)];
    const faces = [{ n: [Math.cos(ry), -Math.sin(ry)], half: d / 2, span: w, r: 0 }, { n: [Math.sin(ry), Math.cos(ry)], half: w / 2, span: d, r: Math.PI / 2 }];
    for (const f of faces) for (const sgn of [1, -1]) {
      const nx = f.n[0] * sgn, nz = f.n[1] * sgn;
      if (nx * toC[0] + nz * toC[1] < 0.25) continue;

class Birds {
  constructor(n = 14, o = {}) {
    this.n = n; this.group = new THREE.Group();
    const wing = new MB(3); wing.tri([0, 0, 0], [0.7, 0.05, -0.12], [0.5, 0.0, 0.16], 0x0c0a10); wing.tri([0, 0, 0], [0.5, 0.0, 0.16], [0.0, 0.0, 0.12], 0x0c0a10);
    const geo = wing.build();
    const m = new THREE.MeshBasicMaterial({ color: tcol(0x0e0b12), side: THREE.DoubleSide, fog: true });
    this.L = new THREE.InstancedMesh(geo, m, n); this.R = new THREE.InstancedMesh(geo, m, n);
    this.L.frustumCulled = this.R.frustumCulled = false;
    this.group.add(this.L, this.R);
    this.rng = new RNG(o.seed || 6); this.b = [];
    const c = o.center || [0, 12, -40], sp = o.spread || [30, 8, 30];
    for (let i = 0; i < n; i++) this.b.push({ x: c[0] + this.rng.range(-sp[0], sp[0]), y: c[1] + this.rng.range(-sp[1], sp[1]), z: c[2] + this.rng.range(-sp[2], sp[2]), ph: this.rng.range(0, 6), sp: this.rng.range(5, 8), s: this.rng.range(0.8, 1.3), turn: this.rng.range(0.05, 0.2), a: this.rng.range(0, 6) });
    this.c = c; this.sp = sp;
    this._m = new THREE.Matrix4(); this._q = new THREE.Quaternion(); this._e = new THREE.Euler(); this._p = new THREE.Vector3(); this._s = new THREE.Vector3();
  }
  update(dt) {
    for (let i = 0; i < this.n; i++) {
      const b = this.b[i];
      b.a += b.turn * dt * 0.6; b.x += Math.sin(b.a) * b.sp * dt; b.z += Math.cos(b.a) * b.sp * dt; b.y += Math.sin(b.ph + G.t * 0.4) * 0.6 * dt;
      if (Math.abs(b.x - this.c[0]) > this.sp[0] * 1.4 || Math.abs(b.z - this.c[2]) > this.sp[2] * 1.4) b.a += Math.PI;
      const fl = Math.sin(G.t * 7.5 + b.ph * 3) * 0.7;
      this._e.set(0, b.a + Math.PI / 2 * 0, 0, 'YXZ'); 
      for (const side of [1, -1]) {
        this._e.set(0, b.a - Math.PI / 2, side * fl, 'YXZ'); this._q.setFromEuler(this._e);
        this._s.set(b.s, b.s, side * b.s); this._m.compose(this._p.set(b.x, b.y, b.z), this._q, this._s);
        (side === 1 ? this.L : this.R).setMatrixAt(i, this._m);
      }
    }
    this.L.instanceMatrix.needsUpdate = true; this.R.instanceMatrix.needsUpdate = true;
  }
}

class Pigeons {
  constructor(n, area, o = {}) {
    this.n = n; this.area = area; this.rng = new RNG(o.seed || 12); this.group = new THREE.Group();
    const bmb = new MB(5); bmb.jit = 0.03;
    bmb.sph(0.12, 0, 0.16, 0, 0x7a7a86, { d: 1, sx: 0.8, sy: 0.75, sz: 1.3 }); bmb.sph(0.065, 0, 0.27, 0.13, 0x5a5a6a, { d: 1 }); bmb.box(0.02, 0.02, 0.05, 0, 0.265, 0.2, 0xd8b060); bmb.box(0.05, 0.03, 0.15, 0, 0.14, -0.2, 0x60606c);
    bmb.box(0.015, 0.09, 0.015, 0.03, 0, 0.02, 0xc08080); bmb.box(0.015, 0.09, 0.015, -0.03, 0, 0.02, 0xc08080);
    const wmb = new MB(6); wmb.tri([0, 0, 0], [0.25, 0.02, -0.06], [0.2, 0, 0.12], 0x8a8a96);
    this.body = new THREE.InstancedMesh(bmb.build(), Mat.lit({ side: THREE.DoubleSide }), n); this.wL = new THREE.InstancedMesh(wmb.build(), Mat.lit({ side: THREE.DoubleSide }), n); this.wR = new THREE.InstancedMesh(wmb.build(), Mat.lit({ side: THREE.DoubleSide }), n);

    this.b = [];
    for (let i = 0; i < n; i++) this.b.push({ x: area[0] + this.rng.next() * (area[2] - area[0]), z: area[1] + this.rng.next() * (area[3] - area[1]), y: 0, yaw: this.rng.range(0, 6.28), st: 'peck', t: this.rng.range(0, 3), vx: 0, vz: 0, vy: 0, fl: 0, ph: this.rng.range(0, 6) });
    this._m = new THREE.Matrix4(); this._q = new THREE.Quaternion(); this._e = new THREE.Euler(); this._p = new THREE.Vector3(); this._s = new THREE.Vector3(1, 1, 1);
  }
  update(dt, pp) {
    const r = this.rng;
    for (let i = 0; i < this.n; i++) {
      const b = this.b[i];
      const dx = b.x - pp.x, dz = b.z - pp.z, d = Math.hypot(dx, dz);
      if (b.st !== 'fly' && d < 3.0) { b.st = 'fly'; b.t = r.range(2.2, 3.4); b.vx = (dx / (d || 1)) * r.range(3.5, 5.5) + r.range(-1, 1); b.vz = (dz / (d || 1)) * r.range(3.5, 5.5) + r.range(-1, 1); b.vy = r.range(2.5, 4); b.yaw = Math.atan2(b.vx, b.vz); if (i % 3 === 0) Snd.pigeonWings({ pan: clamp(dx * 0.15, -1, 1), gain: 0.5 }); }
      b.t -= dt;
      if (b.st === 'fly') {
        b.x += b.vx * dt; b.z += b.vz * dt; b.y = Math.max(0, b.y + b.vy * dt); b.vy -= 3.2 * dt; if (b.y > 4) b.vy = Math.min(b.vy, 0);
        b.fl += dt * 22;
        if (b.t <= 0 && b.y <= 0.001) { b.st = 'peck'; b.t = r.range(1, 4); b.y = 0; b.fl = 0; }
        else if (b.y <= 0.001 && b.vy < 0) { b.vy = 0.8; b.vx *= 0.6; b.vz *= 0.6; }
      } else if (b.st === 'peck') { if (b.t <= 0) { if (r.chance(0.5)) { b.st = 'walk'; b.t = r.range(0.6, 1.8); b.yaw += r.range(-1.5, 1.5); } else b.t = r.range(1, 3); } }
      else if (b.st === 'walk') { b.x += Math.sin(b.yaw) * 0.5 * dt; b.z += Math.cos(b.yaw) * 0.5 * dt; if (b.t <= 0) { b.st = 'peck'; b.t = r.range(1, 3.5); } }
      const bob = b.st === 'peck' ? Math.max(0, Math.sin(G.t * 9 + b.ph)) * 0.05 : 0;
      this._e.set(b.st === 'peck' ? 0.3 * bob * 10 : 0, b.yaw, 0); this._q.setFromEuler(this._e);
      this._m.compose(this._p.set(b.x, b.y, b.z), this._q, this._s); this.body.setMatrixAt(i, this._m);
      const fl = b.st === 'fly' ? Math.sin(b.fl) * 0.9 : 0;
      for (const side of [1, -1]) {
        this._e.set(0, b.yaw, side * (fl + (b.st === 'fly' ? 0 : 0.5))); this._q.setFromEuler(this._e);
        this._s.set(side, 1, 1); this._m.compose(this._p.set(b.x, b.y + 0.2, b.z), this._q, this._s); (side === 1 ? this.wL : this.wR).setMatrixAt(i, this._m); this._s.set(1, 1, 1);
      }
    }
    for (const m of [this.body, this.wL, this.wR]) m.instanceMatrix.needsUpdate = true;
  }
}

const WATER_VS = 'varying vec3 vW; void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }';

async function prologRun() {
  Story.resetState();
  Goals.set({ mama: 'long', ten: 'todo', maybach: 'todo', school: 'todo', hurt: 'todo' });
  Bal.shown = 23.17; Obj.set(''); Hint.hide();
  Mus.stop(1.6); Snd.ambClear(0.5); Snd.heartStop();
  UI.hud(true); FX.fade = 1; FX.fadeCol = [0, 0, 0]; FX.bars = 0; FX.dof = 0; FX.water = 0; FX.flash = 0;
  G.mode = 'title'; Title.black(true);
  await sleep(0.6);
  await Game.loadWorld('room');
  Title.black(false);
  const W = G.world, ch = Player.ch;
  ch.place(-0.47, 0, -0.34, Math.PI / 2); ch.setPose('sitFloor'); ch.snapPose(); ch.hold('phone', true); W.phoneOn = 0.55;
  Focus.allowed = false;
  Mus.play(CUES.room, { mood: 'silence', delay: 0.5 });

  // --- Eröffnung: schwarz, nur Regen und eine tickende Uhr ---
  await Cine.run(async (c) => {
    Cam.set({ pos: [-0.25, 3.3, 0.7], look: [-0.5, 0.12, -0.35], fov: 42 });
    Cam.move({ pos: [-0.15, 2.45, 1.2], look: [-0.5, 0.35, -0.3], fov: 40 }, 17, 'inOutSine');
    await sleep(1.8);
    Stamp.show('3:47', { x: '6vw', y: '80vh', sec: 6 });
    await Game.fade(0, 3.6);
    await sleep(1.4);
    Phone.bank(23.17);
    await sleep(1.2);
    await Sub.inner('Dreiundzwanzig Euro siebzehn.', { dur: 2.8 });
    await sleep(0.6);
    await Sub.inner('Und ein Traum, der zu groß ist für dieses Zimmer.', { dur: 4.4 });
    await sleep(1.2);
    Phone.hide();
    Mus.mood('drone', 4);
    await sleep(1.2);
    // Nahaufnahme: sein Gesicht im Licht des Handys
    Cam.set({ pos: [0.02, 0.4, 0.78], look: [-0.47, 0.8, -0.34], fov: 30, dof: 0.85 });
    Cam.move({ pos: [-0.12, 0.47, 0.6], look: [-0.47, 0.8, -0.34], fov: 24, dof: 0.85 }, 8, 'inOutSine');
    await sleep(3.2);
    Phone.toast('Kerim', 'Bruder, lebst du noch?', 6);
    Snd.phoneBuzz(undefined, 2);
    await sleep(1.2);
    Hint.show('<b>E</b> — Antworten', 5);
    const replied = await until(() => Input.pressed('use'), 5.2);
    Hint.hide();
    if (replied) { G.state.counters.kerim++; Phone.msgs('Kerim', [{ t: 'Bruder, lebst du noch?' }, { t: 'Lebe. Bin dran.', me: 1 }]); await sleep(2.6); Phone.hide(); }
    await sleep(0.8);
  }, { stay: true, hint: false });
  Phone.hide(); Hint.hide();

  // --- Sitzen bleiben, bis man aufsteht ---
  FX.dof = 0; Cam.gameplay(); G.mode = 'play'; Player.lock();
  Hint.show('<b>E</b> oder eine Richtung — Aufstehen', 60);
  await untilKeep(() => Input.pressed('use') || Input.pressed('confirm') || Math.hypot(Input.axis().x, Input.axis().y) > 0.3);
  Hint.hide();
  ch.hold('phone', false); ch.setPose('mirza', 3.6);
  Snd.whoosh(0.5, { gain: 0.25, from: 180, to: 700 });
  await sleep(1.8);
  Player.unlock(); Focus.allowed = true;
  Obj.set('Mach Licht.');
  await untilKeep(() => G.state.flags.prologDone);

  // --- Titel ---
  await Game.fade(1, 1.6, [0, 0, 0]);
  Snd.ambClear(2); Mus.stop(1.2);
  UI.hud(false);
  await sleep(1.0);
  Mus.play(CUES.title, { mood: 'on', delay: 0.2, fadeOut: 1 });
  await Title.show({ num: '', title: 'MAKTUB', line: '<span class="tar">مكتوب</span><br>Es steht geschrieben.', big: true, note: false });
  await sleep(10.5);
  await Title.hide();
  Goals.set({ ten: 'cur' });
}
Story.def('prolog', prologRun);

/* ==== 83_deal.js ==== */
// =====================================================================
// Deal-System: das Gegenüber lesen (Fokus), Druck / Ruhe / Aufstehen / Schweigen, Ungesagtes, Zahltag-Ritual.
// Nichts scheitert endgültig – „es steht geschrieben“ –, aber WIE man gewinnt, prägt Mirza.
// =====================================================================
const zeroPose = () => { const o = { rootX: 0, rootY: 0, rootZ: 0 }; for (const j of JOINTS) o[j] = [0, 0, 0]; return o; };
const sitP = (o) => mkPose(Object.assign({ y: -0.52, z: -0.06, legL: { flex: 88, knee: 90, foot: 0, abd: 3 }, legR: { flex: 88, knee: 90, foot: 0, abd: 3 } }, o));
const SIT = {
  idle: sitP({ lean: 5, nod: 8, L: { arm: [38, 8, 0], fore: 86 }, R: { arm: [40, 8, 0], fore: 86 } }),
  watch: sitP({ lean: 3, nod: 6, L: { arm: [42, 4, 0], fore: 104, hand: 6 }, R: { arm: [38, 8, 0], fore: 86 } }),
  arms: sitP({ lean: -4, nod: 5, L: { arm: [36, 2, 0], fore: 124 }, R: { arm: [36, 2, 0], fore: 124 } }),
  tap: sitP({ lean: 5, nod: 8, L: { arm: [38, 8, 0], fore: 86 }, R: { arm: [36, 6, 0], fore: 92, hand: 14 } }),
  lean: sitP({ lean: 16, nod: 4, L: { arm: [48, 8, 0], fore: 72 }, R: { arm: [48, 8, 0], fore: 72 } }),
  relax: sitP({ lean: -3, nod: 2, L: { arm: [30, 10, 0], fore: 70 }, R: { arm: [30, 10, 0], fore: 70 } }),
  sip: sitP({ lean: 3, nod: 4, L: { arm: [38, 8, 0], fore: 86 }, R: { arm: [42, 6, 0], fore: 108, hand: -20 } }),
  hard: sitP({ lean: -6, nod: 2, L: { arm: [38, 2, 0], fore: 128 }, R: { arm: [38, 2, 0], fore: 128 } }),
  sign: sitP({ lean: 14, nod: 24, L: { arm: [40, 8, 0], fore: 84 }, R: { arm: [46, 6, 0], fore: 78, hand: 12 } }),
};
const ME_SIT = { idle: sitP({ lean: 6, nod: 6, L: { arm: [40, 8, 0], fore: 84 }, R: { arm: [40, 8, 0], fore: 84 } }), lean: sitP({ lean: 12, nod: 4, L: { arm: [46, 8, 0], fore: 74 }, R: { arm: [46, 8, 0], fore: 74 } }), sign: sitP({ lean: 14, nod: 22, L: { arm: [40, 8, 0], fore: 84 }, R: { arm: [46, 6, 0], fore: 78, hand: 12 } }) };
// Beobachtbares Verhalten des Gegenübers (Bewegung obenauf)
const TELL_ANIM = {
  watch: (o, t) => { const p = Math.max(0, Math.sin(t * 1.9)); o.head[0] = p * p * 14; o.armL[0] = -p * 6; },
  arms: (o, t) => { o.spine[0] = -Math.sin(t * 0.8) * 1.2; o.head[2] = Math.sin(t * 0.5) * 2; },
  tap: (o, t) => { o.handR[0] = Math.sin(t * 15) * 12; o.foreR[0] = -Math.max(0, Math.sin(t * 7.5)) * 5; },
  lean: (o, t) => { o.spine[0] = Math.sin(t * 1.1) * 1.5; },
  hard: (o, t) => { o.spine[0] = -Math.sin(t * 0.9) * 1.0; },
};
const TELL_JOINT = { watch: ['handL', 0.5, 0.22], arms: ['chest', 1.15, 0.3], tap: ['handR', 0.55, -0.24], lean: ['head', 0.95, 0.35] };
const Tells = {
  set(ch, kind, k = 5) {
    ch.setPose(SIT[kind] || SIT.idle, k); ch._tell = kind; ch.overlay = zeroPose();
    ch.onUpdate = () => { const ov = ch.overlay, f = TELL_ANIM[ch._tell]; if (!ov) return; if (f) f(ov, G.t); };
  },
  clear(ch) { ch._tell = null; ch.overlay = null; ch.onUpdate = null; },
};

// ---------- Fokus-Lesen: kleines Etikett am Gegenüber ----------
const Tell = {
  el: null, pos: null, text: '', on: false, force: false, v: new THREE.Vector3(),
  set(posFn, text) { this.pos = posFn; this.text = text; },
  clear() { this.pos = null; this.force = false; if (this.el) { this.el.classList.remove('on'); this.on = false; } },
  update(camera) {
    if (!this.el) { this.el = $('#tell'); if (!this.el) return; this.sp = this.el.querySelector('span'); }
    const want = !!this.pos && (G.focus > 0.55 || this.force) && G.mode !== 'menu';
    if (!want) { if (this.on) { this.el.classList.remove('on'); this.on = false; } return; }
    const w = this.pos(); this.v.copy(w).project(camera);
    if (this.v.z > 1) { this.el.classList.remove('on'); this.on = false; return; }
    const x = (this.v.x * 0.5 + 0.5) * window.innerWidth, y = (-this.v.y * 0.5 + 0.5) * window.innerHeight;
    if (this.sp.textContent !== this.text) this.sp.textContent = this.text;
    this.el.style.transform = `translate(${Math.round(clamp(x + 30, 10, window.innerWidth - 360))}px, ${Math.round(clamp(y - 30, window.innerHeight * 0.12, window.innerHeight * 0.36))}px)`;
    if (!this.on) { this.el.classList.add('on'); this.on = true; }
  },
};

const DEAL_TAG = { push: 'Druck', calm: 'Ruhe', stand: 'Aufstehen', silence: 'Schweigen' };
const Deal = {
  score: 0, fails: 0, D: null,
  // D: { name, partner, me, shots:{them,me,wide}, tellPos(): Vector3, mood: ['calm','tense','push'], cue }
  begin(D) {
    this.D = D; this.score = 0; this.fails = 0;
    Mus.play(D.cue || CUES.deal, { mood: D.start || (D.mood ? D.mood[0] : 'calm'), fadeOut: 2.2, delay: 0.15 });
  },
  // Beide schauen sich an (folgt den Köpfen); gibt die Funktion zum Lösen zurück
  eyeLock(a, b) {
    const W = G.world, va = new THREE.Vector3(), vb = new THREE.Vector3();
    const fn = () => { a.j.head.getWorldPosition(va); b.j.head.getWorldPosition(vb); };
    fn(); W.onUpdate(fn); a.lookAt(vb, 0.9); b.lookAt(va, 0.9);
    return () => { const i = W.updaters.indexOf(fn); if (i >= 0) W.updaters.splice(i, 1); a.lookAt(null); b.lookAt(null); };
  },
  end() { const D = this.D; Tell.clear(); Focus.allowed = false; if (D) { Tells.clear(D.partner); D.partner.lookAt(null); } G.slow = 1; },
  shot(spec, dur = 0) { if (!spec) return Promise.resolve(); if (dur > 0) return Cam.move(spec, dur, 'inOutSine'); Cam.set(spec); return Promise.resolve(); },
  // Kurzer Schnitt auf das, was das Gegenüber verrät
  async insert(kind, dur = 1.5) {
    const D = this.D, ch = D.partner, spec = TELL_JOINT[kind]; if (!spec || G.skipping) return;
    const p = new THREE.Vector3(); ch.j[spec[0]].getWorldPosition(p);
    const fw = new THREE.Vector3(Math.sin(ch.yaw), 0, Math.cos(ch.yaw)), rt = new THREE.Vector3(fw.z, 0, -fw.x);
    const pos = p.clone().addScaledVector(fw, spec[1]).addScaledVector(rt, spec[2]); pos.y += 0.06;
    const from = [pos.x + fw.x * 0.14, pos.y, pos.z + fw.z * 0.14];
    Cam.set({ pos: from, look: [p.x, p.y, p.z], fov: kind === 'arms' ? 34 : 26, dof: 0.9 });
    Cam.move({ pos: [pos.x, pos.y, pos.z], look: [p.x, p.y, p.z] }, dur, 'inOutSine');
    if (kind === 'watch') { Snd.countTick(2); setTimeout(() => Snd.countTick(2), 480); setTimeout(() => Snd.countTick(2), 960); }
    else if (kind === 'tap') for (let i = 0; i < 6; i++) setTimeout(() => Snd.step('wood', { vel: 0.22 }), i * 170);
    else if (kind === 'arms') Snd.whoosh(0.35, { gain: 0.1, from: 260, to: 160 });
    else Snd.door('creak');
    await sleep(dur);
    FX.dof = 0;
  },
  async rewind() {
    Snd.whoosh(0.95, { gain: 0.5, from: 2600, to: 160 });
    FX.water = 0.9; FX.ca = 0.012; tween(FX, { water: 0, ca: 0 }, 1.1, 'out'); FX.flash = 0.25; tween(FX, { flash: 0 }, 0.9, 'out');
    await sleep(0.9);
  },
  silenceFx(on) {
    if (on) { Mus.mood('silence', 1.0); tween(G, { slow: 0.5 }, 0.6, 'out'); Snd.worldFilter(1400, 0.6); Snd.heartStart(56, 0.32); }
    else { const D = this.D; Mus.mood(D && D.mood ? D.mood[Math.min(D.mood.length - 1, this.step || 0)] : 'calm', 0.9); tween(G, { slow: 1 }, 0.5, 'out'); Snd.worldFilter(20000, 0.6); Snd.heartStop(); }
  },
  // Auswahlleiste. Schweigen: Leertaste (oder 4) HALTEN.
  async pick(R, force) {
    const box = $('#choices'), sil = $('#silence'), fill = $('i', sil); box.innerHTML = '';
    const opts = R.opts, n = opts.length;
    let sel = 0, result = -1, held = 0, mouseHeld = false, fx = false;
    const items = opts.map((o, i) => {
      const d = h('div', 'choice dopt' + (o.key === 'silence' ? ' hold' : ''));
      d.innerHTML = `<span class="k">${i + 1}</span><span class="tag">${DEAL_TAG[o.key]}</span><span class="ln">${o.key === 'silence' ? 'Nichts sagen. <small>Leertaste halten</small>' : o.text}</span>`;
      d.style.animationDelay = i * 0.14 + 's'; box.appendChild(d);
      d.addEventListener('mouseenter', () => { sel = i; mark(); Snd.uiHover(); });
      d.addEventListener('pointerdown', () => { sel = i; mark(); if (o.key === 'silence') mouseHeld = true; else { result = i; Snd.uiClick(); } });
      return d;
    });
    const up = () => { mouseHeld = false; }; window.addEventListener('pointerup', up);
    const mark = () => items.forEach((d, i) => d.classList.toggle('sel', i === sel));
    mark();
    Tell.force = !!force; Cine.skippable = false; Focus.allowed = true; $('#hud').classList.add('subs-on', 'deal-on');
    const HOLD = 2.4;
    try {
    await sleep(0.55);
    await until(() => {
      if (Input.pressed('up') && sel > 0) { sel--; mark(); Snd.uiHover(); }
      if (Input.pressed('down') && sel < n - 1) { sel++; mark(); Snd.uiHover(); }
      for (let i = 0; i < 4; i++) if (Input.pressed('n' + (i + 1)) && i < n) { sel = i; mark(); if (opts[i].key !== 'silence') { result = i; Snd.uiClick(); } }
      if (Input.pressed('confirm') && opts[sel].key !== 'silence') { result = sel; Snd.uiClick(); }
      const isSil = opts[sel].key === 'silence', down = isSil && (Input.key('confirm') || Input.key('n' + (sel + 1)) || mouseHeld);
      const dt = G.dt || 0.016;
      if (down) { held += dt; if (!fx) { fx = true; this.silenceFx(true); } } else if (held > 0) { held = Math.max(0, held - dt * 3); if (held === 0 && fx) { fx = false; this.silenceFx(false); } }
      sil.classList.toggle('on', held > 0.05); fill.style.width = (Math.min(1, held / HOLD) * 100).toFixed(1) + '%';
      items.forEach((d, i) => d.classList.toggle('held', down && i === sel));
      if (held >= HOLD) result = sel;
      return result >= 0;
    });
    } finally { window.removeEventListener('pointerup', up); sil.classList.remove('on'); fill.style.width = '0%'; }
    Focus.allowed = false; Tell.clear();
    items.forEach((d, i) => { if (i !== result) d.style.opacity = 0; d.style.transition = 'opacity .5s'; });
    await sleep(0.4);
    box.innerHTML = ''; $('#hud').classList.remove('subs-on', 'deal-on');
    return { key: opts[result].key, opt: opts[result], fx };
  },
  // Eine Runde. R: {tell, hint, say:[..], best, opts:[{key,text}], good:[..], bad:{key:[..]|default}, inner:{good, bad:{…}}, soft}
  async round(R, idx) {
    const D = this.D, P = D.partner, me = D.me, name = D.name;
    this.step = idx;
    let attempt = 0;
    for (;;) {
      Tells.set(P, R.tell);
      Tell.set(() => D.tellPos(), R.hint);
      Mus.mood(D.mood ? D.mood[Math.min(D.mood.length - 1, idx)] : 'calm', 1.2);
      await this.shot(D.shots.them);
      FX.dof = 0.35; Cam.dofAuto = true;
      if (attempt === 0) { for (const l of R.say) await Sub.say(name, l, { dur: l.length > 46 ? 4.2 : 3 }); } else await Sub.inner('Noch einmal.', { dur: 1.5 });
      await this.insert(R.tell, 1.5);
      await this.shot(D.shots.them);

    if (G.skipping) return;
    const e = h('div', 'mnum', html); e.style.left = x; e.style.top = `calc(var(--bar) + ${y})`; $('#hud').appendChild(e);

  // n Schläge warten und danach auf das Musikraster einrasten (Schnitt auf den Beat)
  async beats(n) {
    await sleep(Math.max(0.05, n * BEAT - 0.07));
    const w = Mus.nextBeatIn(); if (typeof w === 'number' && w < BEAT) await sleep(w);
  },
};

// =====================================================================
// Dev-/Test-Hooks (nur aktiv mit ?test oder ?dev): Offline-Audio-Render + Analyse für automatische Prüfungen.
// =====================================================================
function fftMag(re, im) { // iterative Radix-2 FFT (in place) -> Amplituden
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -TAU / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = i + k + len / 2;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
  const out = new Float32Array(n / 2);
  for (let i = 0; i < n / 2; i++) out[i] = Math.hypot(re[i], im[i]) / n;
  return out;
}
function spectrogramPNG(data, sr, opts = {}) {
  const N = 2048, hop = opts.hop || 1024, fmax = opts.fmax || 4000, W = Math.min(1400, Math.floor((data.length - N) / hop)), H = 360;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H + 24;
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H + 24);
  const win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos((TAU * i) / (N - 1));
  const re = new Float32Array(N), im = new Float32Array(N);
  const img = ctx.createImageData(W, H);
  const binHz = sr / N, fmin = 50;
  for (let x = 0; x < W; x++) {
    const o = Math.floor(x * ((data.length - N) / W));
    for (let i = 0; i < N; i++) { re[i] = data[o + i] * win[i]; im[i] = 0; }
    const mag = fftMag(re, im);
    for (let y = 0; y < H; y++) {
      const f = fmin * Math.pow(fmax / fmin, 1 - y / (H - 1)); // logarithmische Frequenzachse
      const b = Math.min(N / 2 - 1, Math.round(f / binHz));
      const db = 20 * Math.log10(mag[b] + 1e-7), v = clamp((db + 90) / 70);
      const i4 = (y * W + x) * 4;
      img.data[i4] = clamp(v * 2.2 - 0.6) * 255; img.data[i4 + 1] = clamp(v * 1.6 - 0.15) * 255; img.data[i4 + 2] = clamp(0.35 + v * 1.1 - v * v * 1.2) * 255 * (v > 0.05 ? 1 : 0.4); img.data[i4 + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
  for (const f of [110, 220, 440, 880, 1760, 3520]) { const y = (1 - Math.log(f / fmin) / Math.log(fmax / fmin)) * (H - 1); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(0, y, 10, 1); ctx.fillText(f + '', 12, y + 4); }
  const secs = data.length / sr;
  for (let s = 0; s < secs; s += 2) { const x = (s / secs) * W; ctx.fillStyle = '#fff'; ctx.fillText(s + 's', x + 2, H + 16); ctx.fillRect(x, H, 1, 6); }
  return cv.toDataURL('image/png');
}
function analyse(bufs, sr) {
  const d = bufs[0], n = d.length;
  let peak = 0, nan = 0, dc = 0;
  const rms = [];

function measurePitch(data, sr, f0) { // Grundton per zero-gepaddeter FFT + parabolische Interpolation

  const p = (0.5 * (a - c)) / (a - 2 * b + c);
  return (bi + p) * bh;
}

        skyTop: lin(0x3a4a70), skyHorizon: lin(0xb0a090), sunDir: [-0.4, 0.55, 0.7], sunCol: lin(0xffe0b0, 1.2), sunDisc: 0,
        hemiSky: lin(0x8896b8, 0.9), hemiGround: lin(0x50483e), hemiInt: 0.9, keyCol: lin(0xffe2b8), keyInt: 2.4, fillCol: lin(0x6f88b8), fillInt: 0.5, fillDir: [0.6, 0.2, 0.7],
        fogCol: lin(0x9a9aa8), fogDen: 0.004, exposure: 1.0, bloom: 0.06, vig: 0.25, grain: 0.02, ca: 0, flare: 0, rays: 0,
      }, atmo || {}));
      const mb = new MB(2); mb.floor(24, 24, 0, 0, 0, 0x777068, { nx: 12, nz: 12, checker: 0x6e6860 });
      scene.add(mb.mesh(Mat.lit()));
      this.scene = scene; curScene = scene; return scene;
    },
    cam(pos, look, fov = 32) { const c = GFX.camera; c.position.set(...pos); c.lookAt(...look); c.fov = fov; c.updateProjectionMatrix(); },
    shoot(sec = 0.5) { FX.fade = 0; for (let i = 0; i < 10; i++) { const dt = sec / 10; G.dt = dt; G.t += dt; G.rt += dt; scene_update(dt); } Atmo.update(GFX.camera, null); GFX.render(curScene, GFX.camera); },
  };
}

})();
