<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MAKTUB</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="MAKTUB – ein cineastisches Story-Game. Es steht geschrieben.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&family=Caveat:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&text=%D9%85%D9%83%D8%AA%D9%88%D8%A8&display=swap">
<style>
/* =====================================================================
   MAKTUB – UI. Palette: Schwarz, Creme, Gold. Drei Schriften:
   Cormorant Garamond (Display-Serif), Hanken Grotesk (klare Grotesk), Caveat (Handschrift Notizbuch).
   Aref Ruqaa nur für das kalligrafische مكتوب.
   ===================================================================== */
:root {
  --black: #000; --ink: #0a0908; --cream: #efe6d2; --cream-dim: rgba(239, 230, 210, .66); --cream-faint: rgba(239, 230, 210, .34);
  --gold: #d9ac4f; --gold-soft: #b58a3a; --line: rgba(217, 172, 79, .55);
  --serif: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;
  --sans: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --hand: 'Caveat', 'Segoe Script', 'Bradley Hand', cursive;
  --arab: 'Aref Ruqaa', 'Amiri', 'Noto Naskh Arabic', serif;
  --sub-scale: 1; --bar: 0px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; color: var(--cream); font-family: var(--sans); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #000; }
#ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.hidden { display: none !important; }
.screen { position: absolute; inset: 0; }
.sc { font-family: var(--serif); text-transform: uppercase; letter-spacing: .4em; font-weight: 500; }

/* ---------- Startbildschirm ---------- */
#start { background: #000; display: grid; place-items: center; pointer-events: auto; cursor: pointer; transition: opacity 1.6s ease; z-index: 50; }
#start.out { opacity: 0; pointer-events: none; }
#start .hp { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: clamp(26px, 3.6vw, 52px); letter-spacing: .05em; color: var(--cream); opacity: 0; animation: fadeIn 3.2s .6s ease forwards; text-align: center; padding: 0 6vw; }
#start .hint { position: absolute; bottom: 9vh; width: 100%; text-align: center; font-family: var(--sans); font-size: 11px; letter-spacing: .5em; text-transform: uppercase; color: var(--cream-faint); opacity: 0; animation: fadeIn 2s 3.4s ease forwards, breathe 3.6s 5.4s ease-in-out infinite; }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }

/* ---------- Hauptmenü ---------- */
#menu { display: flex; align-items: center; z-index: 20; }
#menu::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 90% at 16% 52%, rgba(0, 0, 0, .62), rgba(0, 0, 0, 0) 64%), linear-gradient(to top, rgba(0, 0, 0, .5), rgba(0, 0, 0, 0) 30%); pointer-events: none; }
#menu .col { position: relative; padding-left: clamp(28px, 8vw, 150px); max-width: 100%; }
#menu h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(60px, 11.5vw, 190px); line-height: .95; letter-spacing: .3em; margin-right: -.3em; color: var(--cream); text-shadow: 0 0 60px rgba(217, 172, 79, .28), 0 2px 40px rgba(0, 0, 0, .6); opacity: 0; animation: titleIn 4.2s .3s cubic-bezier(.2, .7, .1, 1) forwards; }
@keyframes titleIn { from { opacity: 0; letter-spacing: .62em; filter: blur(6px); } 60% { opacity: 1; } to { opacity: 1; letter-spacing: .3em; filter: blur(0); } }
#menu .ar { font-family: var(--arab); font-weight: 700; font-size: clamp(30px, 4.2vw, 68px); color: var(--gold); margin: .1em 0 .05em .12em; line-height: 1.3; opacity: 0; animation: fadeIn 2.6s 2s ease forwards; text-shadow: 0 0 30px rgba(217, 172, 79, .35); direction: rtl; text-align: left; }
#menu .sub { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(15px, 1.6vw, 24px); letter-spacing: .32em; text-transform: uppercase; color: var(--cream-dim); opacity: 0; animation: fadeIn 2.6s 2.8s ease forwards; padding-left: .1em; }
#menu nav { margin-top: clamp(30px, 6vh, 70px); display: flex; flex-direction: column; align-items: flex-start; gap: clamp(8px, 1.6vh, 16px); pointer-events: auto; }
.mbtn { position: relative; font-family: var(--serif); font-weight: 500; font-size: clamp(15px, 1.5vw, 20px); letter-spacing: .44em; text-transform: uppercase; color: var(--cream-dim); padding: 9px 0; opacity: 0; transform: translateX(-10px); animation: btnIn 1.4s ease forwards; transition: color .35s, letter-spacing .5s; text-align: left; }
.mbtn:nth-child(1) { animation-delay: 3.6s; } .mbtn:nth-child(2) { animation-delay: 3.85s; } .mbtn:nth-child(3) { animation-delay: 4.1s; } .mbtn:nth-child(4) { animation-delay: 4.35s; }
@keyframes btnIn { to { opacity: 1; transform: none; } }
.mbtn::after { content: ''; position: absolute; left: 0; bottom: 3px; width: 0; height: 1px; background: linear-gradient(90deg, var(--gold), rgba(217, 172, 79, 0)); transition: width .6s cubic-bezier(.2, .7, .1, 1); }
.mbtn:hover, .mbtn:focus-visible { color: #fff3d6; letter-spacing: .5em; outline: none; }
.mbtn:hover::after, .mbtn:focus-visible::after { width: 100%; }
#menu .foot { position: absolute; left: clamp(28px, 8vw, 150px); bottom: 5vh; font-size: 10.5px; letter-spacing: .4em; text-transform: uppercase; color: var(--cream-faint); opacity: 0; animation: fadeIn 2s 5s ease forwards; }

/* ---------- Kapitel & Einstellungen (Panels) ---------- */
.panel { background: rgba(0, 0, 0, .86); z-index: 40; display: grid; place-items: center; pointer-events: auto; opacity: 0; transition: opacity .5s ease; backdrop-filter: blur(6px); }
.panel.on { opacity: 1; }
.panel .box { width: min(760px, 90vw); max-height: 86vh; overflow: auto; padding: 4vh 2vw; scrollbar-width: thin; scrollbar-color: var(--gold-soft) transparent; }
.panel h2 { font-family: var(--serif); font-weight: 300; font-size: clamp(30px, 3.6vw, 52px); letter-spacing: .32em; text-transform: uppercase; color: var(--cream); margin-bottom: 4vh; text-align: center; padding-left: .32em; }
.panel h2::after { content: ''; display: block; width: 44px; height: 1px; background: var(--gold); margin: 22px auto 0; }
.chap { display: grid; grid-template-columns: 78px 1fr; align-items: baseline; gap: 6px 18px; padding: 15px 8px; border-bottom: 1px solid rgba(239, 230, 210, .08); cursor: pointer; position: relative; transition: background .4s; text-align: left; width: 100%; }
.chap .n { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 30px; color: var(--gold); text-align: right; }
.chap .t { font-family: var(--serif); font-weight: 500; font-size: 20px; letter-spacing: .3em; text-transform: uppercase; color: var(--cream); transition: letter-spacing .5s, color .3s; }
.chap .s { grid-column: 2; font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--cream-faint); }
.chap:hover { background: linear-gradient(90deg, rgba(217, 172, 79, .08), rgba(217, 172, 79, 0)); }
.chap:hover .t { letter-spacing: .36em; color: #fff3d6; }
.chap.soon { opacity: .38; cursor: default; }
.chap.soon:hover { background: none; } .chap.soon:hover .t { letter-spacing: .3em; color: var(--cream); }
.back { display: block; margin: 5vh auto 0; }
.row { display: grid; grid-template-columns: 1fr minmax(180px, 46%); align-items: center; gap: 20px; padding: 16px 4px; border-bottom: 1px solid rgba(239, 230, 210, .08); }
.row label { font-family: var(--serif); font-size: 17px; letter-spacing: .3em; text-transform: uppercase; color: var(--cream-dim); }
.seg { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.seg button { font-family: var(--sans); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--cream-faint); padding: 8px 12px; border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
.seg button:hover { color: var(--cream); } .seg button.on { color: var(--gold); border-color: var(--gold); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: linear-gradient(90deg, var(--gold) var(--p, 50%), rgba(239, 230, 210, .22) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 1px; background: rgba(239, 230, 210, .22); }
input[type=range]::-moz-range-progress { height: 1px; background: var(--gold); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--gold); margin-top: -5px; box-shadow: 0 0 14px rgba(217, 172, 79, .6); }
input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--gold); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#subs { position: absolute; left: 0; right: 0; bottom: calc(var(--bar) + 6.2vh); text-align: center; padding: 0 7vw; }
#hud::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 34vh; background: linear-gradient(to top, rgba(0, 0, 0, .46), rgba(0, 0, 0, 0)); opacity: 0; transition: opacity .8s; pointer-events: none; }
#hud.subs-on::before { opacity: 1; }
#hud.deal-on::before { height: 52vh; background: linear-gradient(to top, rgba(0, 0, 0, .78), rgba(0, 0, 0, .5) 45%, rgba(0, 0, 0, 0)); }
.sub { display: inline-block; max-width: min(920px, 86vw); font-family: var(--serif); font-size: calc(clamp(23px, 2.5vw, 37px) * var(--sub-scale)); line-height: 1.3; font-weight: 400; color: var(--cream); text-shadow: 0 2px 16px rgba(0, 0, 0, .9), 0 0 3px rgba(0, 0, 0, .95); opacity: 0; transform: translateY(7px); transition: opacity .5s ease, transform .7s ease; }
.sub.on { opacity: 1; transform: none; }
.sub.inner { font-style: italic; }
.sub.say { font-family: var(--sans); font-weight: 400; font-size: calc(clamp(17px, 1.75vw, 26px) * var(--sub-scale)); letter-spacing: .012em; }
.sub.nour { font-style: italic; font-weight: 300; color: #f2cfac; letter-spacing: .02em; text-shadow: 0 2px 18px rgba(80, 30, 10, .8), 0 0 3px rgba(0, 0, 0, .9); }
.sub.sys { font-family: var(--sans); font-size: calc(13px * var(--sub-scale)); letter-spacing: .32em; text-transform: uppercase; color: var(--cream-dim); }
.sub .who { display: block; font-family: var(--sans); font-style: normal; font-size: .46em; letter-spacing: .36em; text-transform: uppercase; color: var(--gold); margin-bottom: .5em; opacity: .9; }
#objective { position: absolute; left: 0; right: 0; bottom: calc(var(--bar) + 2.6vh); text-align: center; font-family: var(--sans); font-size: 12.5px; letter-spacing: .36em; text-transform: uppercase; color: var(--cream); opacity: 0; transition: opacity 1.4s ease; text-shadow: 0 1px 12px rgba(0, 0, 0, .95); padding: 0 6vw; }
#objective::before { content: ''; display: block; width: 0; height: 1px; background: var(--gold); margin: 0 auto 13px; transition: width 1.8s cubic-bezier(.2, .7, .1, 1); }
#objective.on { opacity: .95; } #objective.on::before { width: 68px; }
#balance { position: absolute; top: calc(var(--bar) + 4.5vh); right: 5vw; text-align: right; opacity: 0; transition: opacity .7s ease; }
#balance.on { opacity: 1; }
#balance .delta { font-family: var(--sans); font-size: 13px; letter-spacing: .32em; color: var(--gold); opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .6s; height: 1.6em; }
#balance.pop .delta { opacity: 1; transform: none; }
#balance .amt { font-family: var(--serif); font-weight: 300; font-size: clamp(34px, 4.2vw, 64px); letter-spacing: .03em; color: var(--cream); font-variant-numeric: tabular-nums lining-nums; text-shadow: 0 2px 20px rgba(0, 0, 0, .7); transition: color .6s, text-shadow .6s; }
#balance.pop .amt { color: #ffe2a0; text-shadow: 0 0 36px rgba(217, 172, 79, .65), 0 2px 20px rgba(0, 0, 0, .7); }
#prompt { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 13px; opacity: 0; transition: opacity .25s; white-space: nowrap; font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--cream); text-shadow: 0 1px 12px rgba(0, 0, 0, .95); will-change: transform; }
#prompt.on { opacity: 1; }
#prompt .key { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-family: var(--sans); font-style: normal; font-size: 12px; color: var(--gold); background: rgba(0, 0, 0, .4); box-shadow: 0 0 20px rgba(217, 172, 79, .2); }
#hint { position: absolute; left: 4vw; top: calc(var(--bar) + 4.5vh); max-width: 60vw; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--cream-dim); opacity: 0; transition: opacity 1.4s; text-shadow: 0 1px 8px #000; line-height: 2; }
#hint.on { opacity: .85; } #hint b { color: var(--gold); font-weight: 500; }
#skip { position: absolute; right: 4vw; bottom: calc(var(--bar) + 3vh); display: flex; align-items: center; gap: 12px; font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--cream-dim); opacity: 0; transition: opacity .5s; text-shadow: 0 1px 8px #000; }
#skip.on { opacity: .9; } #skip svg { width: 26px; height: 26px; transform: rotate(-90deg); }
#skip circle { fill: none; stroke-width: 1.5; } #skip .bg { stroke: rgba(239, 230, 210, .25); } #skip .fg { stroke: var(--gold); stroke-dasharray: 69.1; stroke-dashoffset: 69.1; }
#choices { position: absolute; left: 50%; bottom: calc(var(--bar) + 5vh); transform: translateX(-50%); width: min(820px, 92vw); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.choice { pointer-events: auto; cursor: pointer; font-family: var(--serif); font-size: calc(clamp(21px, 2.1vw, 30px) * var(--sub-scale)); color: var(--cream-dim); padding: 6px 6px 8px; position: relative; transition: color .3s, transform .3s, opacity .4s; text-align: center; text-shadow: 0 2px 14px rgba(0, 0, 0, .9); opacity: 0; animation: chIn .7s ease forwards; }
@keyframes chIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.choice .k { font-family: var(--sans); font-size: 11px; letter-spacing: .2em; color: var(--gold-soft); margin-right: 14px; vertical-align: middle; }
.choice::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 0; height: 1px; background: var(--gold); transition: width .4s, left .4s; }
.choice.sel, .choice:hover { color: #fff3d6; } .choice.sel::after, .choice:hover::after { width: 100%; left: 0; }
.choice.unsaid { color: rgba(239, 230, 210, .36); text-decoration: line-through; text-decoration-color: rgba(239, 230, 210, .4); font-style: italic; font-weight: 300; cursor: not-allowed; filter: blur(.35px); animation: chIn .7s ease forwards, flick 4.2s 1s infinite; }
.choice.unsaid.sel::after { background: rgba(239, 230, 210, .35); }
.choice.unsaid.shake { animation: shake .42s ease, flick 4.2s 1s infinite; }
.choice.unlocked { color: var(--gold); text-decoration: none; font-style: italic; filter: none; text-shadow: 0 0 26px rgba(217, 172, 79, .55), 0 2px 14px #000; animation: chIn 1.4s ease forwards; }
@keyframes flick { 0%, 100% { opacity: .85; } 47% { opacity: .55; } 50% { opacity: .95; } 53% { opacity: .6; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
#silence { position: absolute; left: 50%; top: calc(var(--bar) + 11vh); transform: translateX(-50%); width: min(340px, 70vw); text-align: center; opacity: 0; transition: opacity .4s; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--cream-dim); }
#silence.on { opacity: 1; } #silence .bar { height: 1px; background: rgba(239, 230, 210, .22); margin-top: 12px; position: relative; overflow: hidden; } #silence .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--gold); box-shadow: 0 0 12px var(--gold); }
#flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(255, 226, 160, .0), rgba(255, 226, 160, 0)); opacity: 0; }
#overlay-text { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.ov { font-family: var(--serif); font-weight: 300; font-size: clamp(34px, 5vw, 78px); letter-spacing: .06em; color: var(--cream); text-shadow: 0 0 40px rgba(0, 0, 0, .8); opacity: 0; transition: opacity .8s ease; text-align: center; padding: 0 6vw; }
.ov.on { opacity: 1; } .ov.gold { color: #ffe2a0; text-shadow: 0 0 50px rgba(217, 172, 79, .55); }
.ov small { display: block; font-family: var(--sans); font-size: .22em; letter-spacing: .5em; text-transform: uppercase; color: var(--gold); margin-top: 1.2em; }
.stamp { position: absolute; font-family: var(--sans); font-size: 12px; letter-spacing: .4em; text-transform: uppercase; color: var(--cream-dim); opacity: 0; transition: opacity 1s; text-shadow: 0 1px 10px #000; }
.stamp.on { opacity: .9; }

/* ---------- Titelkarte ---------- */
#titlecard { position: absolute; inset: 0; background: #000; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity 1s ease; z-index: 30; }
#titlecard.on { opacity: 1; }
#titlecard .in { text-align: center; padding: 0 6vw; }
#titlecard .num { font-family: var(--serif); font-weight: 300; font-size: clamp(56px, 9vw, 130px); color: var(--gold); letter-spacing: .1em; padding-left: .1em; opacity: 0; transform: translateY(10px); transition: opacity 1.6s .3s ease, transform 2.4s .3s ease; text-shadow: 0 0 50px rgba(217, 172, 79, .3); }
#titlecard .ttl { font-family: var(--serif); font-weight: 400; font-size: clamp(22px, 3.2vw, 48px); letter-spacing: .56em; padding-left: .56em; text-transform: uppercase; color: var(--cream); margin-top: 6px; opacity: 0; transition: opacity 1.8s 1.1s ease, letter-spacing 4s 1.1s ease; }
#titlecard .ln { width: 1px; height: 0; background: var(--gold); margin: clamp(22px, 4vh, 44px) auto; transition: height 1.6s 1.9s cubic-bezier(.2, .7, .1, 1); }
#titlecard .snt { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(17px, 1.9vw, 30px); color: var(--cream-dim); opacity: 0; transition: opacity 2s 2.8s ease; max-width: 800px; margin: 0 auto; }
#titlecard.on .num, #titlecard.on .ttl, #titlecard.on .snt { opacity: 1; transform: none; }
#titlecard.on .ttl { letter-spacing: .62em; }
#titlecard.on .ln { height: clamp(34px, 6vh, 58px); }
#titlecard .tar { display: inline-block; font-family: var(--arab); font-weight: 700; font-style: normal; font-size: clamp(34px, 5vw, 76px); letter-spacing: 0; color: var(--gold); margin-bottom: .3em; text-shadow: 0 0 40px rgba(217, 172, 79, .4); }
#titlecard.big .ttl { font-size: clamp(44px, 9vw, 150px); font-weight: 300; letter-spacing: .34em; padding-left: .34em; }
#titlecard.big.on .ttl { letter-spacing: .4em; }

/* ---------- Handy ---------- */
#phone { position: absolute; right: 5vw; bottom: calc(var(--bar) + 5vh); width: min(290px, 66vw); aspect-ratio: 9 / 18.6; border-radius: 40px; background: #060607; box-shadow: 0 0 0 2px #1a1a1c, 0 0 0 5px #08080a, 0 34px 90px rgba(0, 0, 0, .8), 0 0 80px rgba(110, 150, 255, .10); transform: translateY(40px) scale(.96); opacity: 0; transition: opacity .55s ease, transform .7s cubic-bezier(.2, .8, .2, 1); overflow: hidden; font-family: var(--sans); z-index: 15; }
#phone.on { opacity: 1; transform: none; }
#phone.mid { right: 50%; margin-right: calc(min(290px, 66vw) / -2); bottom: calc(var(--bar) + 9vh); }
.ph-in { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 16px 20px 22px; color: #e9ebef; background: radial-gradient(120% 60% at 50% 0, #101827, #060607 70%); }
.ph-st { display: flex; justify-content: space-between; font-size: 12px; color: #aeb4bf; letter-spacing: .04em; padding: 2px 10px 0; }
.ph-st .isl { width: 62px; height: 18px; border-radius: 12px; background: #000; margin-top: -3px; }
.ph-h { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: #7d8592; margin-top: 30px; }
.ph-big { font-weight: 300; font-size: 39px; letter-spacing: -.01em; color: #f6f7f9; margin-top: 8px; font-variant-numeric: tabular-nums; }
.ph-big.neg { color: #f0a49b; }
.ph-sm { color: #7d8592; font-size: 12.5px; margin-top: 6px; line-height: 1.5; }
.ph-list { margin-top: 22px; display: flex; flex-direction: column; gap: 11px; overflow: hidden; }
.ph-item { display: flex; justify-content: space-between; font-size: 12.5px; color: #b6bcc7; padding-bottom: 10px; border-bottom: 1px solid #14181f; }
.ph-item b { font-weight: 400; color: #e6e9ef; font-variant-numeric: tabular-nums; }
.ph-item.warn b { color: #f0a49b; }
.ph-call { align-items: center; text-align: center; justify-content: space-between; }

        else if (cur && cur.isColor) track.push({ o: cur, col: true, a: cur.clone(), b: tgt.isColor ? tgt : new THREE.Color(tgt[0], tgt[1], tgt[2]) });
      }
    }
    const apply = (it, t) => {
      const e = f(t);
      for (const tr of it.track) {
        if (tr.fn) tr.fn(e, t);
        else if (tr.arr) { for (let i = 0; i < tr.a.length; i++) tr.o[tr.k][i] = lerp(tr.a[i], tr.b[i], e); }
        else if (tr.v3) tr.o.lerpVectors(tr.a, tr.b, e);
        else if (tr.col) tr.o.copy(tr.a).lerp(tr.b, e);
        else tr.o[tr.k] = lerp(tr.a, tr.b, e);
      }
    };
    return new Promise((res, rej) => {
      const it = { kind: 'tween', t: -delay, dur: Math.max(dur, 1e-4), track, apply, res, rej };
      if (this.skipping()) { apply(it, 1); res(); return; }
      this.items.push(it);
    });
  }
  update(dt) {
    const items = this.items;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.t += dt;
      if (it.kind === 'wait') { if (it.t >= it.dur) { items.splice(i, 1); it.res(); } }
      else if (it.kind === 'until') {
        let ok = false;
        try { ok = it.fn(); } catch (e) { console.error(e); ok = true; }
        if (ok) { items.splice(i, 1); it.res(true); } else if (it.t >= it.dur) { items.splice(i, 1); it.res(false); }
      } else if (it.kind === 'tween') {
        if (it.t < 0) continue;
        const p = clamp(it.t / it.dur);
        it.apply(it, p);
        if (p >= 1) { items.splice(i, 1); it.res(); }
      }
    }
  }
  // Überspringen: alles sofort abschließen.
  flush() {
    const all = this.items.splice(0), items = [];
    for (const it of all) { if (it.keep) this.items.push(it); else items.push(it); }
    for (const it of items) {
      if (it.kind === 'tween') it.apply(it, 1);
      it.res(it.kind === 'until' ? false : undefined);
    }
  }
  clear() { this.items.length = 0; }
  // Kapitel abbrechen: alle wartenden Skripte werden mit ABORT beendet (try/finally räumt auf)
  abort() { const items = this.items.splice(0); for (const it of items) it.rej(ABORT); }
}
const ABORT = { aborted: true };

// =====================================================================
// Audio-Engine: alles wird live per Web Audio synthetisiert.
//  Oud/Kanun: Karplus-Strong (Allpass-Fraktionalverzögerung -> exakte Maqam-Stimmung), Korpus-Resonanzen
//  Ney: Periodic-Wave + gefiltertes Rauschen + Vibrato/Scoop   Streicher/Chor: verstimmte Sägezähne + Formanten
//  808: Sinus mit Pitch-Hüllkurve + Sättigung   Hall: generierte Impulsantworten
// Die Engine läuft auf jedem BaseAudioContext (auch OfflineAudioContext -> Analyse-Tests).
// =====================================================================

// --- kleine DSP-Helfer (auf Float32Array) ---
function biqCoef(type, f0, Q, gainDb, sr) {
  const A = Math.pow(10, gainDb / 40), w0 = (TAU * f0) / sr, cw = Math.cos(w0), sw = Math.sin(w0), al = sw / (2 * Q);
  let b0, b1, b2, a0, a1, a2;
  if (type === 'peak') { b0 = 1 + al * A; b1 = -2 * cw; b2 = 1 - al * A; a0 = 1 + al / A; a1 = -2 * cw; a2 = 1 - al / A; }
  else if (type === 'lowpass') { b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = (1 - cw) / 2; a0 = 1 + al; a1 = -2 * cw; a2 = 1 - al; }
  else if (type === 'highpass') { b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = (1 + cw) / 2; a0 = 1 + al; a1 = -2 * cw; a2 = 1 - al; }
  else if (type === 'lowshelf') { const s = 2 * Math.sqrt(A) * al; b0 = A * ((A + 1) - (A - 1) * cw + s); b1 = 2 * A * ((A - 1) - (A + 1) * cw); b2 = A * ((A + 1) - (A - 1) * cw - s); a0 = (A + 1) + (A - 1) * cw + s; a1 = -2 * ((A - 1) + (A + 1) * cw); a2 = (A + 1) + (A - 1) * cw - s; }
  else { const s = 2 * Math.sqrt(A) * al; b0 = A * ((A + 1) + (A - 1) * cw + s); b1 = -2 * A * ((A - 1) + (A + 1) * cw); b2 = A * ((A + 1) + (A - 1) * cw - s); a0 = (A + 1) - (A - 1) * cw + s; a1 = 2 * ((A - 1) - (A + 1) * cw); a2 = (A + 1) - (A - 1) * cw - s; } // highshelf
  return [b0 / a0, b1 / a0, b2 / a0, a1 / a0, a2 / a0];
}
function biqRun(d, c) {
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  const [b0, b1, b2, a1, a2] = c;
  for (let i = 0; i < d.length; i++) {
    const x0 = d[i], y0 = b0 * x0 + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
    x2 = x1; x1 = x0; y2 = y1; y1 = y0; d[i] = y0;
  }
}

// Karplus-Strong mit Allpass-Fraktionalverzögerung. Gibt Mono-Samples zurück.
function ksRender(sr, f, o) {
  const N = Math.floor(sr * o.dur);
  const out = new Float32Array(N);
  const rng = new RNG(((o.seed || 1) * 7919 + Math.floor(f * 100)) >>> 0);
  for (const st of o.strings) {
    const fs = f * Math.pow(2, st.det / 1200);
    const s = o.loop;
    const Lf = sr / fs - s;
    let Ni = Math.floor(Lf), d = Lf - Ni;
    if (d < 0.5) { Ni -= 1; d += 1; }
    const C = (1 - d) / (1 + d);
    const buf = new Float32Array(Ni);
    let lp = 0;
    for (let i = 0; i < Ni; i++) { lp += ((rng.next() * 2 - 1) - lp) * o.excite; buf[i] = lp; }
    const pp = Math.max(1, Math.floor(Ni * o.pos));
    const tmp = buf.slice();
    let mean = 0;
    for (let i = 0; i < Ni; i++) { buf[i] = tmp[i] - tmp[(i + pp) % Ni]; mean += buf[i]; }
    mean /= Ni;
    let pk = 1e-9;
    for (let i = 0; i < Ni; i++) { buf[i] -= mean; pk = Math.max(pk, Math.abs(buf[i])); }
    for (let i = 0; i < Ni; i++) buf[i] /= pk;
    const T60 = o.t60 * Math.pow(220 / fs, o.t60k);
    const rho = Math.pow(10, -3 / (fs * T60));
    let idx = 0, xPrev = 0, apX = 0, apY = 0;
    for (let n = 0; n < N; n++) {
      const x = buf[idx];
      const lpo = ((1 - s) * x + s * xPrev) * rho; xPrev = x;
      const y = C * lpo + apX - C * apY; apX = lpo; apY = y;
      buf[idx] = y; if (++idx >= Ni) idx = 0;
      out[n] += y * st.amp;
    }
  }
  // Anzupf-Klick
  const nClick = Math.floor(sr * 0.006);
  let cp = 0;
  for (let i = 0; i < nClick; i++) { const v = rng.next() * 2 - 1; const hp = v - cp; cp = v; out[i] += hp * o.click * (1 - i / nClick); }
  for (const b of o.body) biqRun(out, biqCoef(b[0], b[1], b[2], b[3], sr));
  // Peak normalisieren, weich ausblenden
  let peak = 1e-9;
  for (let i = 0; i < N; i++) peak = Math.max(peak, Math.abs(out[i]));
  const nf = Math.floor(sr * 0.08);
  for (let i = 0; i < N; i++) { let g = 0.9 / peak; if (i > N - nf) g *= (N - i) / nf; out[i] *= g; }
  return out;
}

const KS_KINDS = {
  oud: {
    dur: 3.0, loop: 0.44, t60: 3.4, t60k: 0.45, pos: 0.13, click: 0.10,
    strings: [{ det: -3, amp: 0.55 }, { det: 4.5, amp: 0.55 }],
    body: [['lowshelf', 130, 0.8, 4], ['peak', 235, 1.4, 3], ['peak', 480, 2.0, 2.5], ['lowpass', 5200, 0.7, 0]],
    excite: [0.42, 0.6, 0.85],
  },
  kanun: {
    dur: 3.6, loop: 0.30, t60: 4.6, t60k: 0.35, pos: 0.09, click: 0.14,
    strings: [{ det: -2.5, amp: 0.4 }, { det: 0, amp: 0.4 }, { det: 3, amp: 0.4 }],
    body: [['peak', 900, 1.2, 2.5], ['peak', 2300, 1.5, 2], ['highshelf', 5000, 0.7, 1.5], ['lowpass', 9500, 0.7, 0]],
    excite: [0.55, 0.75, 0.95],
  },
  saz: {

    body: [['peak', 300, 1.5, 3], ['peak', 1200, 1.8, 3.5], ['lowpass', 6500, 0.7, 0]],

    strings: [{ det: -2, amp: 0.6 }, { det: 2, amp: 0.6 }],
    body: [['lowshelf', 120, 0.8, 5], ['peak', 200, 1.2, 3], ['lowpass', 1800, 0.7, 0]],

const VOWELS = { ah: [[800, 1], [1150, 0.5], [2900, 0.25]], oh: [[450, 1], [800, 0.45], [2830, 0.12]], oo: [[325, 1], [700, 0.35], [2530, 0.1]] };

class AudioEngine {
  constructor(ctx, o = {}) {
    this.ctx = ctx; this.sr = ctx.sampleRate; this.ready = true; this.offline = !!o.offline;
    this.rng = new RNG(o.seed || 99);
    const c = ctx;
    // --- Bus-Graph ---
    this.master = c.createGain(); this.master.gain.value = 0.82;
    this.limiter = c.createDynamicsCompressor();
    this.limiter.threshold.value = -9; this.limiter.knee.value = 12; this.limiter.ratio.value = 9;
    this.limiter.attack.value = 0.004; this.limiter.release.value = 0.22;
    // Soft-Clipper hinter dem Limiter: nie hartes Clipping, sondern warme Sättigung
    this.clip = c.createWaveShaper();
    const cv = new Float32Array(2048);
    for (let i = 0; i < cv.length; i++) { const x = (i / (cv.length - 1)) * 2 - 1; cv[i] = Math.tanh(x * 1.25) / Math.tanh(1.25); }
    this.clip.curve = cv; this.clip.oversample = '2x';
    this.master.connect(this.limiter); this.limiter.connect(this.clip); this.clip.connect(c.destination);
    this.dryMix = c.createGain(); this.dryMix.connect(this.master);
    this.worldLP = c.createBiquadFilter(); this.worldLP.type = 'lowpass'; this.worldLP.frequency.value = Math.min(20000, this.sr * 0.45); this.worldLP.Q.value = 0.5;
    this.worldLP.connect(this.dryMix);
    this.bus = {};
    for (const n of ['music', 'sfx', 'amb', 'ui']) { const g = c.createGain(); g.connect(this.worldLP); this.bus[n] = g; }
    this.bus.clean = c.createGain(); this.bus.clean.connect(this.dryMix);
    this.vol = { music: 0.8, sfx: 0.9 };
    this.hall = this._reverb(4.2, 2.6, 7500, 1400, 0.03);
    this.room = this._reverb(1.1, 3.2, 9000, 2500, 0.004);
    this.hall.ret.connect(this.master); this.room.ret.connect(this.master);
    // Hall unterliegt dem Welt-Filter nicht ganz – im Fokus bleibt er, aber dunkler
    this._noise();
    this.cache = new Map();
    this.neyWave = c.createPeriodicWave(new Float32Array([0, 0, 0, 0, 0, 0, 0, 0, 0]), new Float32Array([0, 1, 0.38, 0.2, 0.1, 0.06, 0.035, 0.02, 0.01]));
  }

  setVolumes(music, sfx) {
    this.vol.music = music; this.vol.sfx = sfx;
    const t = this.ctx.currentTime;
    this.bus.music.gain.setTargetAtTime(music, t, 0.05);
    this.bus.clean.gain.setTargetAtTime(music, t, 0.05);
    this.bus.sfx.gain.setTargetAtTime(sfx, t, 0.05);
    this.bus.amb.gain.setTargetAtTime(sfx, t, 0.05);
    this.bus.ui.gain.setTargetAtTime(sfx, t, 0.05);
  }
  // Tiefpass über der Welt (Fokus / unter Wasser). Nur Herzschlag & Ney (bus.clean) bleiben klar.
  worldFilter(freq, dur = 0.3) {
    const t = this.ctx.currentTime;
    this.worldLP.frequency.cancelScheduledValues(t);
    this.worldLP.frequency.setValueAtTime(Math.max(60, this.worldLP.frequency.value), t);
    this.worldLP.frequency.exponentialRampToValueAtTime(Math.max(60, freq), t + Math.max(0.02, dur));
  }

  _reverb(sec, decay, lp0, lp1, pre) {
    const c = this.ctx, input = c.createGain(), ret = c.createGain();
    const conv = c.createConvolver(), dly = c.createDelay(0.5);
    dly.delayTime.value = pre;
    const len = Math.floor(this.sr * sec);
    const ir = c.createBuffer(2, len, this.sr);
    const r = new RNG(sec * 1000 + 3);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      let y = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        const a = lerp(lp0, lp1, Math.pow(t, 0.5));
        const k = 1 - Math.exp(-TAU * a / this.sr);
        y += ((r.next() * 2 - 1) - y) * k;
        const onset = Math.min(1, i / (this.sr * 0.012));
        d[i] = y * Math.pow(1 - t, decay) * onset * 2.4;
      }
      // frühe Reflexionen
      for (let k = 0; k < 9; k++) { const p = Math.floor(this.sr * (0.006 + r.next() * 0.07)); if (p < len) d[p] += (r.next() * 2 - 1) * 0.5; }
    }
    conv.buffer = ir;
    input.connect(dly); dly.connect(conv); conv.connect(ret);
    ret.gain.value = 0.55;
    return { input, ret, conv };
  }

  _noise() {
    const c = this.ctx, sr = this.sr, len = sr * 4;
    const mk = () => c.createBuffer(1, len, sr);
    const white = mk(), pink = mk(), brown = mk();
    const w = white.getChannelData(0), p = pink.getChannelData(0), b = brown.getChannelData(0);
    const r = new RNG(5);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
    for (let i = 0; i < len; i++) {
      const x = r.next() * 2 - 1;
      w[i] = x;
      b0 = 0.99886 * b0 + x * 0.0555179; b1 = 0.99332 * b1 + x * 0.0750759; b2 = 0.969 * b2 + x * 0.153852;
      b3 = 0.8665 * b3 + x * 0.3104856; b4 = 0.55 * b4 + x * 0.5329522; b5 = -0.7616 * b5 - x * 0.016898;
      p[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + x * 0.5362) * 0.11; b6 = x * 0.115926;
      last = (last + 0.02 * x) / 1.02; b[i] = last * 3.5;
    }
    // Schleifennaht weich überblenden (letzte 0.25 s in den Anfang)
    const xf = Math.floor(sr * 0.25);
    for (const d of [w, p, b]) for (let i = 0; i < xf; i++) { const a = i / xf; d[i] = d[i] * a + d[len - xf + i] * (1 - a); }
    this.noise = { white, pink, brown, len: len - xf };
  }
  noiseSrc(kind, t, rate = 1) {
    const s = this.ctx.createBufferSource();
    s.buffer = this.noise[kind]; s.loop = true; s.loopEnd = this.noise.len / this.sr; s.playbackRate.value = rate;
    s.start(t, this.rng.next() * 2.5);
    return s;
  }

  // Routing: node -> [Gain] -> [Pan] -> bus (+ Sends)
  out(node, o = {}) {
    const c = this.ctx;
    let n = node;
    if (o.gain != null && o.gain !== 1) { const g = c.createGain(); g.gain.value = o.gain; n.connect(g); n = g; }
    if (o.pan && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); n.connect(p); n = p; }
    n.connect(o.dest || this.bus[o.bus || 'music']);
    if (o.hall > 0) { const s = c.createGain(); s.gain.value = o.hall; n.connect(s); s.connect(this.hall.input); }
    if (o.room > 0) { const s = c.createGain(); s.gain.value = o.room; n.connect(s); s.connect(this.room.input); }
    return n;
  }

  // ---------------- Gezupfte Saiten ----------------
  ksBuffer(kind, f, bucket) {
    const key = kind + ':' + f.toFixed(2) + ':' + bucket;
    let b = this.cache.get(key);
    if (b) return b;
    const k = KS_KINDS[kind];
    const data = ksRender(this.sr, f, Object.assign({}, k, { excite: k.excite[bucket], seed: bucket + 1 }));
    b = this.ctx.createBuffer(1, data.length, this.sr);
    b.getChannelData(0).set(data);
    this.cache.set(key, b);
    return b;
  }
  pluck(kind, f, t, o = {}) {
    const vel = o.vel != null ? o.vel : 0.7;
    const bucket = vel < 0.5 ? 0 : vel < 0.8 ? 1 : 2;
    const src = this.ctx.createBufferSource();
    src.buffer = this.ksBuffer(kind, f, bucket);
    const g = this.ctx.createGain();
    const amp = (o.gain != null ? o.gain : 1) * Math.pow(vel, 1.2) * 0.85;
    g.gain.value = amp;
    if (o.dur) { g.gain.setValueAtTime(amp, t + o.dur); g.gain.setTargetAtTime(0, t + o.dur, o.damp || 0.07); }
    src.connect(g);
    this.out(g, { bus: o.bus || 'music', dest: o.dest, pan: o.pan || 0, hall: o.hall != null ? o.hall : 0.32, room: o.room != null ? o.room : 0.07 });
    src.start(t);
    return src;
  }

  // ---------------- Ney ----------------
  ney(f, t, dur, o = {}) {
    const c = this.ctx, vel = o.vel != null ? o.vel : 0.7;
    const osc = c.createOscillator();
    osc.setPeriodicWave(this.neyWave);
    const scoop = o.scoop != null ? o.scoop : -55;
    osc.frequency.setValueAtTime(f * Math.pow(2, scoop / 1200), t);
    osc.frequency.exponentialRampToValueAtTime(f, t + 0.075);
    if (o.to) { // Glissando in eine Zielnote (Cent-basiert / Frequenz)
      const gt = t + Math.max(0.1, dur - (o.glideLen || 0.25));
      osc.frequency.setValueAtTime(f, gt);
      osc.frequency.exponentialRampToValueAtTime(o.to, gt + (o.glideLen || 0.25));
    }
    const lfo = c.createOscillator(); lfo.frequency.value = 5.0 + this.rng.next() * 0.7;
    const lg = c.createGain();
    const vib = o.vib != null ? o.vib : 14;
    lg.gain.setValueAtTime(0, t); lg.gain.setValueAtTime(0, t + 0.22); lg.gain.linearRampToValueAtTime(vib, t + 0.22 + Math.min(0.7, dur * 0.6));
    lfo.connect(lg); lg.connect(osc.detune);
    const trem = c.createOscillator(); trem.frequency.value = 4.6 + this.rng.next() * 0.9;
    const tg = c.createGain(); tg.gain.value = 0.05 * vel; trem.connect(tg);
    const g = c.createGain();
    const peak = 0.55 * vel, sus = peak * 0.8, atk = o.attack != null ? o.attack : 0.09;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + atk);
    g.gain.setTargetAtTime(sus, t + atk, 0.22);
    const rel = o.release != null ? o.release : 0.16;
    g.gain.setValueAtTime(sus, Math.max(t + atk + 0.02, t + dur));
    g.gain.setTargetAtTime(0.0001, t + dur, rel * 0.5);
    tg.connect(g.gain);
    // Atem
    const nz = this.noiseSrc('white', t);
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = Math.min(9000, f * 2.15); bp.Q.value = 1.3;
    const ng = c.createGain();
    const br = (o.breath != null ? o.breath : 1) * vel;
    ng.gain.setValueAtTime(0, t); ng.gain.linearRampToValueAtTime(0.34 * br, t + 0.035);
    ng.gain.setTargetAtTime(0.12 * br, t + 0.05, 0.1);
    ng.gain.setValueAtTime(0.12 * br, t + dur); ng.gain.setTargetAtTime(0, t + dur, rel * 0.4);
    const air = c.createBiquadFilter(); air.type = 'highpass'; air.frequency.value = 3800;
    const ag = c.createGain(); ag.gain.value = 0.05 * br;
    nz.connect(bp); bp.connect(ng);
    nz.connect(air); air.connect(ag);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2300 + f * 1.4; lp.Q.value = 0.6;

// =====================================================================
// Musik-Sequencer: Maqam-Skalen, Layer-System (adaptiv), Cues, Stinger.
// Ereignisse (pro Layer, 16 Schritte = 1 Takt):
//   Note:      [schritt, grad, länge, velocity, {opts}]     grad 0 = Tonika (D), 7 = Oktave …, negativ = darunter
//   Akkord:    [schritt, [grade…], länge, velocity, {opts}]
//   Perkussion:[schritt, 'dum'|'tek'|…, velocity, {opts}]
// Schritte dürfen Nachkommastellen haben (32stel-Rolls).
// =====================================================================
const TONIC = 293.6648; // D4
const MAQAM = {
  kurd: [0, 1, 3, 5, 7, 8, 10],      // D Eb F G A Bb C   – Trauer, Sehnsucht
  hijaz: [0, 1, 4, 5, 7, 8, 10],     // D Eb F# G A Bb C  – Ehrgeiz, Gold (erweiterte Sekunde)
  nahawand: [0, 2, 3, 5, 7, 8, 11],  // D E F G A Bb C#   – Wärme, Verlangen
  ajam: [0, 2, 4, 5, 7, 9, 11],      // D E F# G A B C#   – Erinnerung, Süße (Dur-nah)
  bayati: [0, 1.5, 3, 5, 7, 8, 10],  // D E½b F G A Bb C  – Viertelton
};
const semiOf = (scale, deg) => scale[((deg % 7) + 7) % 7] + 12 * Math.floor(deg / 7);

class Music {
  constructor(A) {
    this.A = A; this.cue = null; this.layers = {}; this.retired = [];
    this.scale = MAQAM.kurd; this.tonic = TONIC; this.bpm = 66;
    this.step = 0; this.stepT = 0; this.timer = null; this.rng = new RNG(31);
    this.moodName = null; this.startedAt = 0;
  }
  freq(deg, oct = 0, scale) { return this.tonic * Math.pow(2, (semiOf(scale || this.scale, deg) + 12 * oct) / 12); }
  get stepDur() { return 60 / this.bpm / 4; }

  play(cue, o = {}) {
    const A = this.A, now = A.ctx.currentTime;
    this._retire(o.fadeOut != null ? o.fadeOut : 2.0);
    this.cue = cue;
    this.scale = MAQAM[cue.maqam || 'kurd']; this.tonic = cue.tonic || TONIC; this.bpm = cue.bpm || 66;
    this.layers = {};
    for (const name in cue.layers) {
      const L = cue.layers[name];
      const node = A.ctx.createGain(); node.gain.value = 0;
      node.connect(A.bus[L.bus || 'music']);
      const len = L.len || cue.len || 64;
      const pat = new Array(len).fill(null);
      for (const ev of L.ev || []) { const i = Math.floor(ev[0]) % len; (pat[i] || (pat[i] = [])).push(ev); }
      this.layers[name] = { name, inst: L.inst, len, pat, node, tgt: 0, oct: L.oct || 0, opts: L.opts || {}, vel: L.vel != null ? L.vel : 1, trim: L.gain != null ? L.gain : 1, mode: L.mode ? MAQAM[L.mode] : null, hum: L.hum != null ? L.hum : 0.008, pan: L.pan || 0 };
    }
    this.step = o.keepStep ? this.step : 0;
    this.stepT = now + (o.delay != null ? o.delay : 0.15);
    this.startedAt = this.stepT;
    this.mood(o.mood || cue.mood || 'silence', o.moodFade != null ? o.moodFade : 0.05);
    if (!this.timer && !A.offline) this.timer = setInterval(() => this.pump(), 35);
    return this;
  }
  _retire(fade) {
    const A = this.A, now = A.ctx.currentTime;
    for (const k in this.layers) {
      const L = this.layers[k];
      L.node.gain.cancelScheduledValues(now);
      L.node.gain.setTargetAtTime(0, now, Math.max(0.03, fade / 3));
      this.retired.push(L.node);
      L.tgt = 0;
    }
    this.layers = {};
    if (!A.offline && this.retired.length > 40) { this.retired.splice(0, this.retired.length - 40).forEach((n) => { try { n.disconnect(); } catch (e) { /* egal */ } }); }
  }
  stop(fade = 2) {
    this._retire(fade); this.cue = null; this.moodName = null;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  }
  setLayers(map, dur = 1.5, at) {
    const now = at != null ? at : this.A.ctx.currentTime;
    for (const k in map) {
      const L = this.layers[k]; if (!L) continue;
      L.tgt = map[k];
      L.node.gain.cancelScheduledValues(now);
      L.node.gain.setTargetAtTime(map[k] * L.trim, now, Math.max(0.02, dur / 3));
    }
  }
  mood(name, dur = 1.5, at) {
    const c = this.cue; if (!c) return;

  }
  pump() {
    if (!this.cue) return;
    const now = this.A.ctx.currentTime;

  }
  scheduleUntil(sec) { while (this.cue && this.stepT < sec) this._scheduleStep(); } // Offline-Render
  _scheduleStep() {

    const sw = this.step % 2 === 1 ? (c.swing || 0) * sd : 0;
    const T = this.stepT + sw;
    if (c.loop !== false || this.step < (c.len || 64)) {
      for (const k in this.layers) {
        const L = this.layers[k];
        if (L.tgt < 0.01) continue;
        const evs = L.pat[this.step % L.len];
        if (evs) for (const ev of evs) this._fire(L, ev, T, sd);

  }
  _fire(L, ev, T, sd) {
    const A = this.A;
    const t = Math.max(A.ctx.currentTime, T + (ev[0] - Math.floor(ev[0])) * sd + (L.hum ? (this.rng.next() - 0.5) * L.hum : 0));
    const what = ev[1];
    const scale = L.mode || this.scale;
    if (typeof what === 'string') { // Perkussion
      const o = Object.assign({}, L.opts, ev[3] || {});
      A.perc(what, t, (ev[2] != null ? ev[2] : 0.8) * L.vel, { dest: L.node, pan: o.pan != null ? o.pan : L.pan, hall: o.hall, room: o.room });
      return;
    }
    const len = ev[2] != null ? ev[2] : 4, vel = (ev[3] != null ? ev[3] : 0.7) * L.vel;
    const o = Object.assign({}, L.opts, ev[4] || {});
    const dur = len * sd;
    const fr = (d) => this.freq(d, L.oct + (o.oct || 0), scale);
    switch (L.inst) {
      case 'oud': case 'kanun': case 'saz': case 'bass':
        A.pluck(L.inst, fr(what), t, { vel, dest: L.node, pan: o.pan != null ? o.pan : L.pan, hall: o.hall, room: o.room, dur: o.cut ? dur : undefined });
        break;
      case 'ney':
        A.ney(fr(what), t, dur, { vel, dest: L.node, vib: o.vib, scoop: o.scoop, to: ev[4] && ev[4].to != null ? fr(ev[4].to) : undefined, glideLen: o.glideLen, hall: o.hall, breath: o.breath, pan: o.pan != null ? o.pan : L.pan, attack: o.attack, release: o.release });
        break;
      case 'strings':
        A.strings((Array.isArray(what) ? what : [what]).map(fr), t, dur, { vel, dest: L.node, attack: o.attack, release: o.release, bright: o.bright, hall: o.hall, pan: L.pan });
        break;
      case 'choir':
        A.choir((Array.isArray(what) ? what : [what]).map(fr), t, dur, { vel, dest: L.node, vowel: o.vowel, attack: o.attack, release: o.release, hall: o.hall });
        break;
      case 'sub':
        A.sub(fr(what), t, dur, { vel, dest: L.node, to: ev[4] && ev[4].to != null ? fr(ev[4].to) : undefined });
        break;
      default: break;
    }
  }
  // Im Fokus: nur Ney + Drohne (wenn die Cue eine 'focus'-Stimmung kennt), danach zurück
  focus(on) {
    if (on) { if (this.cue && this.cue.moods && this.cue.moods.focus && this.moodName !== 'focus') { this._m0 = this.moodName; this.mood('focus', 0.5); } }
    else if (this._m0 && this.cue) { this.mood(this._m0, 0.9); this._m0 = null; }
  }
  // Sekunden bis zum nächsten Schlag (für Schnitt-auf-Beat)
  nextBeatIn() {
    if (!this.cue) return 0;
    const sd = this.stepDur * 4, now = this.A.ctx.currentTime;
    const el = Math.max(0, now - this.startedAt);
    return sd - (el % sd);
  }
}

function pinkFill(d, r, amp = 1) {
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < d.length; i++) {

    b0 = 0.99886 * b0 + x * 0.0555179; b1 = 0.99332 * b1 + x * 0.0750759; b2 = 0.969 * b2 + x * 0.153852;
    b3 = 0.8665 * b3 + x * 0.3104856; b4 = 0.55 * b4 + x * 0.5329522; b5 = -0.7616 * b5 - x * 0.016898;
    d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + x * 0.5362) * 0.11 * amp; b6 = x * 0.115926;
  }
}
function brownFill(d, r, amp = 1) { let last = 0; for (let i = 0; i < d.length; i++) { last = (last + 0.02 * (r.next() * 2 - 1)) / 1.02; d[i] = last * 3.5 * amp; } }

  const out = new Float32Array(N);
  for (let i = 0; i < N; i++) out[i] = d[i];
  for (let i = 0; i < xf; i++) { const a = i / xf; out[i] = d[i] * a + d[N + i] * (1 - a); }
  return out;
}

  const out = new Float32Array(n), step = Math.max(1, Math.floor(sr / hz));
  let a = r.next(), b = r.next();
  for (let i = 0; i < n; i++) {
    const k = (i % step) / step;
    if (i % step === 0 && i > 0) { a = b; b = r.next(); }
    const s = k * k * (3 - 2 * k);
    out[i] = a + (b - a) * s;

}

  }
}

});

/* ==== 20_mat.js ==== */
// =====================================================================
// Materialien, Himmel, Atmosphäre
//  - Alle Materialien sind gepatcht: Höhen-/Sonnennebel, Masken-Alpha (Fokus: Nour bleibt Farbe), Rim-Licht.
//  - Atmo besitzt Sonne/Hemi/Fill/Himmel/Nebel/Grading einer Welt und kann sie weich überblenden.
// =====================================================================

// Gemeinsam genutzte Uniform-Objekte: wer .value ändert, ändert es für alle Materialien.
const SU = {
  fogA: { value: new THREE.Vector4(0, 0.1, 0, 0.98) },       // x: Dichte-Faktor, y: Höhenabfall, z: Basis-Y, w: max Nebel
  fogSunDir: { value: new THREE.Vector3(0, 1, 0) },
  fogSunCol: { value: new THREE.Vector3(0, 0, 0) },
  rimDir: { value: new THREE.Vector3(0, 0.3, -1) },
  rimCol: { value: new THREE.Vector3(1, 0.7, 0.4) },
  time: { value: 0 },
};

const FOG_PARS = `
#ifdef USE_FOG
  uniform vec3 fogColor;
  varying float fogDepth;
  varying vec3 vFogWorld;
  uniform float fogDensity;
  uniform vec4 uFogA;
  uniform vec3 uFogSunDir;
  uniform vec3 uFogSunCol;
#endif`;
const FOG_FRAG = `
#ifdef USE_FOG
{
  vec3 fv = vFogWorld - cameraPosition;
  float fdist = length(fv);
  vec3 fdir = fv / max(fdist, 0.0001);
  float hAvg = max(0.5 * (cameraPosition.y + vFogWorld.y) - uFogA.z, 0.0);
  float dens = fogDensity * uFogA.x * exp(-uFogA.y * hAvg);
  float fogFactor = min(1.0 - exp(-dens * dens * fdist * fdist), uFogA.w);
  float sd = max(dot(fdir, uFogSunDir), 0.0);
  vec3 fc = fogColor + uFogSunCol * (pow(sd, 10.0) * 0.7 + pow(sd, 3.0) * 0.18);
  gl_FragColor.rgb = mix(gl_FragColor.rgb, fc, fogFactor);
}
#endif`;
const RIM_PARS = `
uniform float uRim;
uniform vec3 uRimDirW;
uniform vec3 uRimCol;`;
const RIM_FRAG = `
{
  vec3 vdR = normalize(vViewPosition);
  vec3 LvR = normalize((viewMatrix * vec4(uRimDirW, 0.0)).xyz);
  float nvR = clamp(dot(normal, vdR), 0.0, 1.0);
  float rimR = pow(1.0 - nvR, 3.2);
  float facingR = clamp(dot(normal, LvR) * 0.6 + 0.4, 0.0, 1.0);
  float backR = smoothstep(0.35, -0.55, dot(vdR, LvR));
  outgoingLight += uRimCol * (rimR * facingR * backR * uRim * mix(0.3, 1.0, clamp(dot(diffuseColor.rgb, vec3(1.3)), 0.0, 1.0)));
}`;

function patchShader(shader, o) {
  shader.uniforms.uFogA = SU.fogA;
  shader.uniforms.uFogSunDir = SU.fogSunDir;
  shader.uniforms.uFogSunCol = SU.fogSunCol;
  let vs = shader.vertexShader, fs = shader.fragmentShader;
  vs = vs.replace('#include <fog_pars_vertex>', '#include <fog_pars_vertex>\n#ifdef USE_FOG\nvarying vec3 vFogWorld;\n#endif');
  vs = vs.replace('#include <fog_vertex>',
    '#include <fog_vertex>\n#ifdef USE_FOG\n vec4 fwp = vec4(transformed, 1.0);\n#ifdef USE_INSTANCING\n fwp = instanceMatrix * fwp;\n#endif\n vFogWorld = (modelMatrix * fwp).xyz;\n#endif');
  fs = fs.replace('#include <fog_pars_fragment>', FOG_PARS);
  fs = fs.replace('#include <fog_fragment>', FOG_FRAG);
  if (o.mask) {
    shader.uniforms.uMask = o.mask;
    fs = fs.replace('void main() {', 'uniform float uMask;\nvoid main() {');
    fs = fs.replace('#include <dithering_fragment>', '#include <dithering_fragment>\n  gl_FragColor.a = uMask;');
  }
  if (o.rim) {
    shader.uniforms.uRim = o.rim;
    shader.uniforms.uRimDirW = SU.rimDir;
    shader.uniforms.uRimCol = SU.rimCol;
    fs = fs.replace('void main() {', RIM_PARS + '\nvoid main() {');
    fs = fs.replace('gl_FragColor = vec4( outgoingLight, diffuseColor.a );', RIM_FRAG + '\n  gl_FragColor = vec4( outgoingLight, diffuseColor.a );');
  }
  shader.vertexShader = vs;
  shader.fragmentShader = fs;
}

// Mischt Alpha so, dass der Masken-Kanal (RT-Alpha) unberührt bleibt – für alles Transparente/Additive.
function keepMask(m, additive) {
  m.transparent = true;
  m.blending = THREE.CustomBlending;
  m.blendEquation = THREE.AddEquation;
  m.blendSrc = THREE.SrcAlphaFactor;
  m.blendDst = additive ? THREE.OneFactor : THREE.OneMinusSrcAlphaFactor;
  m.blendEquationAlpha = THREE.AddEquation;
  m.blendSrcAlpha = THREE.ZeroFactor;
  m.blendDstAlpha = THREE.OneFactor;
  m.depthWrite = false;
  return m;
}

const Mat = {
  cache: new Map(),
  // Standard-Material für Geometrie mit Vertex-Farben. Pro-Pixel-Licht, Schatten, Nebel.
  lit(o = {}) {
    const m = new THREE.MeshPhongMaterial({
      vertexColors: true,
      specular: tcol(o.spec != null ? o.spec : 0x000000),
      shininess: o.shin != null ? o.shin : 12,
      side: o.side != null ? o.side : THREE.FrontSide,
      emissive: tcol(o.emissive != null ? o.emissive : 0x000000),
      fog: o.fog !== false,
    });
    if (o.map) m.map = o.map;
    if (o.transparent) { m.opacity = o.opacity != null ? o.opacity : 1; keepMask(m, false); m.depthWrite = o.depthWrite !== false; }
    const mask = { value: o.mask || 0 };
    const rim = { value: o.rim || 0 };
    m.userData.mask = mask; m.userData.rim = rim;
    const key = 'lit' + (o.transparent ? 't' : '') + (o.rim ? 'r' : '');
    m.customProgramCacheKey = () => key;
    m.onBeforeCompile = (sh) => patchShader(sh, { mask: o.transparent ? null : mask, rim: o.rim ? rim : null });
    return m;
  },
  // Unbeleuchtet (Leuchtflächen, Himmelsobjekte). Vertex-Farben dürfen > 1 sein (HDR).
  glow(o = {}) {
    const m = new THREE.MeshBasicMaterial({
      vertexColors: o.vertexColors !== false, color: o.color != null ? tcol(o.color) : 0xffffff,
      side: o.side != null ? o.side : THREE.FrontSide, fog: o.fog !== false, map: o.map || null,
    });
    if (o.transparent) { m.opacity = o.opacity != null ? o.opacity : 1; keepMask(m, !!o.additive); }
    const mask = { value: o.mask || 0 };
    m.userData.mask = mask;
    const key = 'glow' + (o.transparent ? 't' : '');
    m.customProgramCacheKey = () => key;
    m.onBeforeCompile = (sh) => patchShader(sh, { mask: o.transparent ? null : mask });
    return m;
  },
  // Farbige Fläche ohne Vertex-Farben (z.B. Canvas-Textur), beleuchtet
  tex(map, o = {}) {
    const m = new THREE.MeshPhongMaterial({
      map, color: 0xffffff, specular: tcol(o.spec != null ? o.spec : 0x000000), shininess: o.shin || 8,
      emissive: tcol(o.emissive != null ? o.emissive : 0x000000), emissiveMap: o.emissiveMap || null,
      side: o.side != null ? o.side : THREE.FrontSide, fog: o.fog !== false,
    });
    if (o.transparent) { m.opacity = o.opacity != null ? o.opacity : 1; keepMask(m, false); }
    const mask = { value: o.mask || 0 };
    m.userData.mask = mask;
    const key = 'tex' + (o.transparent ? 't' : '') + (o.emissiveMap ? 'e' : '');
    m.customProgramCacheKey = () => key;
    m.onBeforeCompile = (sh) => patchShader(sh, { mask: o.transparent ? null : mask });
    return m;
  },
  // Unbeleuchtete Textur (Bildschirme, Schilder, Leuchtreklame)
  screen(map, o = {}) {
    const m = new THREE.MeshBasicMaterial({ map, color: tcol(0xffffff, o.gain || 1), side: o.side != null ? o.side : THREE.FrontSide, fog: o.fog !== false });
    if (o.transparent) { m.opacity = o.opacity != null ? o.opacity : 1; keepMask(m, !!o.additive); }
    const mask = { value: o.mask || 0 };
    m.userData.mask = mask;
    const key = 'screen' + (o.transparent ? 't' : '');
    m.customProgramCacheKey = () => key;
    m.onBeforeCompile = (sh) => patchShader(sh, { mask: o.transparent ? null : mask });
    return m;
  },
};

// ---------- Canvas-Texturen ----------
function canvasTex(w, h, draw, o = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (draw) draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = o.linear ? THREE.LinearEncoding : THREE.sRGBEncoding;
  t.anisotropy = o.aniso || 4;
  if (o.nomip) { t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; }
  t.userData = { canvas: c, ctx };
  return t;
}

// ---------- Himmel ----------
const SKY_VS = `
varying vec3 vDir;
void main() {
  vDir = normalize(position);
  vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  gl_Position = p.xyww;
}`;
const SKY_FS = `
varying vec3 vDir;
uniform vec3 uTop; uniform vec3 uHorizon; uniform vec3 uBottom;
uniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uSunDisc; uniform float uSunGlow;
uniform float uStars; uniform float uCloud; uniform vec3 uCloudLit; uniform vec3 uCloudDark;
uniform float uTime;
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + 7.1; a *= 0.5; } return s; }
void main() {
  vec3 d = normalize(vDir);
  float hgt = d.y;
  float t = pow(clamp(hgt, 0.0, 1.0), 0.55);
  vec3 col = mix(uHorizon, uTop, t);
  col = mix(col, uBottom, smoothstep(0.0, -0.3, hgt));
  float sd = max(dot(d, normalize(uSunDir)), 0.0);
  // Horizontband auf der Sonnenseite
  float sideGlow = pow(sd, 3.0) * exp(-abs(hgt) * 4.0);
  col += uSunCol * (sideGlow * 0.35 + pow(sd, 24.0) * 0.5 * uSunGlow + pow(sd, 6.0) * 0.12 * uSunGlow);
  // Sonnenscheibe (HDR)
  float disc = smoothstep(0.99955, 0.99985, sd);
  col += uSunCol * disc * 14.0 * uSunDisc;
  // Wolken: gestreckte Bänder
  if (uCloud > 0.001 && hgt > -0.02) {
    vec2 cp = d.xz / (max(hgt, 0.0) + 0.16);
    float n = fbm(cp * vec2(0.9, 2.3) + vec2(uTime * 0.004, 0.0));
    float band = smoothstep(0.48, 0.72, n) * smoothstep(-0.02, 0.10, hgt) * (1.0 - smoothstep(0.35, 0.8, hgt));
    float lit = pow(sd, 2.0) * 0.8 + 0.2;
    vec3 cc = mix(uCloudDark, uCloudLit, lit);
    col = mix(col, cc, band * uCloud);
  }
  // Sterne
  if (uStars > 0.001 && hgt > 0.0) {
    vec2 sp = d.xz / (hgt + 0.25) * 90.0;
    vec2 id = floor(sp);
    float r = h21(id);
    vec2 f = fract(sp) - 0.5;
    float star = step(0.985, r) * smoothstep(0.22, 0.0, length(f + (vec2(h21(id + 3.1), h21(id + 7.7)) - 0.5) * 0.5));
    star *= 0.6 + 0.4 * sin(uTime * (1.0 + r * 3.0) + r * 40.0);
    col += vec3(0.85, 0.9, 1.0) * star * uStars * smoothstep(0.0, 0.2, hgt);
  }
  gl_FragColor = vec4(col, 0.0);
}`;

class Sky {
  constructor() {
    this.mat = new THREE.ShaderMaterial({
      vertexShader: SKY_VS, fragmentShader: SKY_FS, side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
      uniforms: {
        uTop: { value: new THREE.Vector3() }, uHorizon: { value: new THREE.Vector3() }, uBottom: { value: new THREE.Vector3() },
        uSunDir: { value: new THREE.Vector3(0, 0.2, -1) }, uSunCol: { value: new THREE.Vector3(1, 0.7, 0.4) },
        uSunDisc: { value: 1 }, uSunGlow: { value: 1 }, uStars: { value: 0 }, uCloud: { value: 0 },
        uCloudLit: { value: new THREE.Vector3(1, 0.6, 0.4) }, uCloudDark: { value: new THREE.Vector3(0.2, 0.15, 0.25) },
        uTime: { value: 0 },
      },
    });
    this.mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), this.mat);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = -1000;
    this.mesh.scale.setScalar(200);
  }
}

// ---------- Atmosphäre ----------
// Alle Werte sind Zahlen oder Zahlen-Arrays -> generisch überblendbar.
const ATMO_BASE = {
  skyTop: lin(0x101830), skyHorizon: lin(0x30405a), skyBottom: lin(0x080a12),
  sunDir: [0.3, 0.4, -0.85], sunCol: lin(0xffb070, 1.2), sunDisc: 0, sunGlow: 1,
  stars: 0, cloud: 0, cloudLit: lin(0xffa070), cloudDark: lin(0x302a48),
  hemiSky: lin(0x405070), hemiGround: lin(0x141018), hemiInt: 0.6,
  keyCol: lin(0xffc890), keyInt: 0, fillCol: lin(0x6080c0), fillInt: 0, fillDir: [-0.5, 0.4, 0.7],
  fogCol: lin(0x1a2436), fogDen: 0.02, fogHK: 0.1, fogBase: 0, fogMax: 0.97, fogSun: [0, 0, 0],
  rimDir: [0, 0.2, -1], rimCol: lin(0xffa860, 0.8),
  exposure: 1.0, contrast: 1.06, sat: 1.0, lift: [0, 0, 0], gain: [1, 1, 1], shadowTint: [0, 0, 0], highTint: [0, 0, 0],
  bloom: 0.12, bloomTint: [1, 1, 1], vig: 0.4, grain: 0.05, ca: 0.0012,
  dof: 0, dofFocus: 5, dofRange: 3, rays: 0, flare: 0,
};

const _sd = new THREE.Vector3();
const Atmo = {
  cur: JSON.parse(JSON.stringify(ATMO_BASE)),
  scene: null, hemi: null, sun: null, fill: null, sky: null, shadowR: 14, sunDist: 60,
  set(spec) { Object.assign(this.cur, JSON.parse(JSON.stringify(spec))); },
  // Weich überblenden (nutzt den Story-Scheduler -> pausierbar, überspringbar)
  to(spec, dur = 2, e = 'inOutSine') {
    const from = {};
    for (const k in spec) from[k] = Array.isArray(this.cur[k]) ? this.cur[k].slice() : this.cur[k];
    const cur = this.cur;
    return tween((t) => {
      for (const k in spec) {
        const a = from[k], b = spec[k];
        if (Array.isArray(b)) { for (let i = 0; i < b.length; i++) cur[k][i] = lerp(a[i], b[i], t); }
        else cur[k] = lerp(a, b, t);
      }
    }, null, dur, e);
  },
  // Baut Sonne/Hemi/Fill/Himmel in eine Szene ein und verbindet sie mit den geteilten Uniforms.
  attach(scene, { shadows = true, sky = true, shadowR = 14, sunDist = 60 } = {}) {
    this.scene = scene; this.shadowR = shadowR; this.sunDist = sunDist;
    this.hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 1);
    scene.add(this.hemi);
    this.sun = new THREE.DirectionalLight(0xffffff, 1);
    this.sun.castShadow = shadows;
    const sc = this.sun.shadow.camera;
    sc.left = -shadowR; sc.right = shadowR; sc.top = shadowR; sc.bottom = -shadowR; sc.near = 1; sc.far = sunDist * 2 + 10;
    this.sun.shadow.mapSize.set(2048, 2048);
    this.sun.shadow.bias = -0.0004; this.sun.shadow.normalBias = 0.04;
    scene.add(this.sun); scene.add(this.sun.target);
    this.fill = new THREE.DirectionalLight(0xffffff, 0);
    scene.add(this.fill);
    scene.fog = new THREE.FogExp2(0x000000, 0.01);
    if (sky) { this.sky = new Sky(); scene.add(this.sky.mesh); } else this.sky = null;
    this.focusPoint = new THREE.Vector3();
  },
  applyShadowQuality(size) {
    if (!this.sun) return;
    const on = size > 0;
    this.sun.castShadow = on && this.sun.userData.wantShadow !== false;
    if (on && this.sun.shadow.mapSize.x !== size) {
      this.sun.shadow.mapSize.set(size, size);
      if (this.sun.shadow.map) { this.sun.shadow.map.dispose(); this.sun.shadow.map = null; }
    }
  },
  // pro Frame: Werte in Lichter/Uniforms schreiben
  update(camera, followPos) {
    const c = this.cur;
    if (!this.scene) return;
    const sd = _sd.set(c.sunDir[0], c.sunDir[1], c.sunDir[2]).normalize();
    this.hemi.color.setRGB(c.hemiSky[0], c.hemiSky[1], c.hemiSky[2]);
    this.hemi.groundColor.setRGB(c.hemiGround[0], c.hemiGround[1], c.hemiGround[2]);
    this.hemi.intensity = c.hemiInt;
    this.sun.color.setRGB(c.keyCol[0], c.keyCol[1], c.keyCol[2]);
    this.sun.intensity = c.keyInt;
    const fp = followPos || this.focusPoint;
    // Schatten-Kamera am Spieler ausrichten und auf Texelraster einrasten (kein Flimmern)
    const texel = (this.shadowR * 2) / (this.sun.shadow.mapSize.x || 2048);
    const sx = Math.round(fp.x / texel) * texel, sz = Math.round(fp.z / texel) * texel;
    this.sun.target.position.set(sx, 0, sz);
    this.sun.position.set(sx + sd.x * this.sunDist, sd.y * this.sunDist, sz + sd.z * this.sunDist);
    this.sun.target.updateMatrixWorld();
    this.fill.color.setRGB(c.fillCol[0], c.fillCol[1], c.fillCol[2]);
    this.fill.intensity = c.fillInt;
    this.fill.position.set(c.fillDir[0], c.fillDir[1], c.fillDir[2]);
    const f = this.scene.fog;
    f.color.setRGB(c.fogCol[0], c.fogCol[1], c.fogCol[2]);
    f.density = c.fogDen;
    SU.fogA.value.set(1, c.fogHK, c.fogBase, c.fogMax);
    SU.fogSunDir.value.copy(sd);
    SU.fogSunCol.value.set(c.fogSun[0], c.fogSun[1], c.fogSun[2]);
    SU.rimDir.value.set(c.rimDir[0], c.rimDir[1], c.rimDir[2]).normalize();
    SU.rimCol.value.set(c.rimCol[0], c.rimCol[1], c.rimCol[2]);
    if (this.sky) {
      const u = this.sky.mat.uniforms;
      u.uTop.value.set(c.skyTop[0], c.skyTop[1], c.skyTop[2]);
      u.uHorizon.value.set(c.skyHorizon[0], c.skyHorizon[1], c.skyHorizon[2]);
      u.uBottom.value.set(c.skyBottom[0], c.skyBottom[1], c.skyBottom[2]);
      u.uSunDir.value.copy(sd);
      u.uSunCol.value.set(c.sunCol[0], c.sunCol[1], c.sunCol[2]);
      u.uSunDisc.value = c.sunDisc; u.uSunGlow.value = c.sunGlow;
      u.uStars.value = c.stars; u.uCloud.value = c.cloud;
      u.uCloudLit.value.set(c.cloudLit[0], c.cloudLit[1], c.cloudLit[2]);
      u.uCloudDark.value.set(c.cloudDark[0], c.cloudDark[1], c.cloudDark[2]);
      u.uTime.value = G.t;
      this.sky.mesh.position.copy(camera.position);
      this.sky.mesh.scale.setScalar(Math.min(camera.far * 0.9, 400));

    SU.time.value = G.t;
  },
  sunDirVec(out) { return out.set(this.cur.sunDir[0], this.cur.sunDir[1], this.cur.sunDir[2]).normalize(); },
};

// =====================================================================
// Post-Processing: HDR-Szene -> Bloom-Kette -> Composite (DOF, Godrays, Flare, Grading, Fokus) -> Final (FXAA, Korn, Letterbox)
// =====================================================================
const GLSL_COMMON = `
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
`;
const POST_VS = `
varying vec2 vUv;
void main(){ vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const DOWN_FS = GLSL_COMMON + `
uniform sampler2D tSrc; uniform vec2 uTexel; uniform float uKaris;
varying vec2 vUv;
vec4 S(vec2 o){ return texture2D(tSrc, vUv + o * uTexel); }
void main(){
  vec4 A=S(vec2(-1.,-1.)), B=S(vec2(0.,-1.)), C=S(vec2(1.,-1.)), D=S(vec2(-.5,-.5)), E=S(vec2(.5,-.5));
  vec4 F=S(vec2(-1.,0.)), G=S(vec2(0.,0.)), H=S(vec2(1.,0.)), I=S(vec2(-.5,.5)), J=S(vec2(.5,.5));
  vec4 K=S(vec2(-1.,1.)), L=S(vec2(0.,1.)), M=S(vec2(1.,1.));
  vec4 o;
  if (uKaris > 0.5) {
    vec4 g0=(D+E+I+J)*0.25, g1=(A+B+G+F)*0.25, g2=(B+C+H+G)*0.25, g3=(F+G+L+K)*0.25, g4=(G+H+M+L)*0.25;
    float w0=1./(1.+lum(g0.rgb)), w1=1./(1.+lum(g1.rgb)), w2=1./(1.+lum(g2.rgb)), w3=1./(1.+lum(g3.rgb)), w4=1./(1.+lum(g4.rgb));
    float ws = w0*0.5 + (w1+w2+w3+w4)*0.125;
    vec3 rgb = (g0.rgb*w0*0.5 + (g1.rgb*w1 + g2.rgb*w2 + g3.rgb*w3 + g4.rgb*w4)*0.125) / ws;
    float a = g0.a*0.5 + (g1.a+g2.a+g3.a+g4.a)*0.125;
    o = vec4(rgb, a);
  } else {
    o = (D+E+I+J)*0.125 + (A+B+G+F)*0.03125 + (B+C+H+G)*0.03125 + (F+G+L+K)*0.03125 + (G+H+M+L)*0.03125;
  }
  gl_FragColor = o;
}`;

const UP_FS = `
uniform sampler2D tSrc; uniform sampler2D tBase; uniform vec2 uTexel; uniform float uScatter;
varying vec2 vUv;
void main(){
  vec4 a=texture2D(tSrc, vUv+uTexel*vec2(-1.,1.)), b=texture2D(tSrc, vUv+uTexel*vec2(0.,1.)), c=texture2D(tSrc, vUv+uTexel*vec2(1.,1.));
  vec4 d=texture2D(tSrc, vUv+uTexel*vec2(-1.,0.)), e=texture2D(tSrc, vUv), f=texture2D(tSrc, vUv+uTexel*vec2(1.,0.));
  vec4 g=texture2D(tSrc, vUv+uTexel*vec2(-1.,-1.)), h=texture2D(tSrc, vUv+uTexel*vec2(0.,-1.)), i=texture2D(tSrc, vUv+uTexel*vec2(1.,-1.));
  vec4 up = (a + c + g + i + 2.0*(b + d + f + h) + 4.0*e) / 16.0;
  gl_FragColor = mix(texture2D(tBase, vUv), up, uScatter);
}`;

const COMP_FS = GLSL_COMMON + `
uniform sampler2D tScene; uniform sampler2D tDepth; uniform sampler2D tBloom; uniform sampler2D tBlurA; uniform sampler2D tBlurB;
uniform vec2 uRes; uniform float uTime, uNear, uFar, uAspect;
uniform float uExposure, uContrast, uSat, uBloom, uBloomThresh;
uniform vec3 uBloomTint, uLift, uGain, uShadowTint, uHighTint;
uniform float uVig, uCA, uWater, uFocus, uWarm, uFlash;
uniform float uDof, uFocusDist, uFocusRange;
uniform vec2 uSun; uniform vec3 uSunCol; uniform float uRays, uFlare, uSunEdge;
varying vec2 vUv;

float linZ(float d){ float z = d * 2.0 - 1.0; return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear)); }
vec3 aces(vec3 x){ const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14; return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0); }

float sunVisibility(){
  float v = 0.0;
  vec2 o0 = vec2(0.0), o1 = vec2(1.0, 0.0), o2 = vec2(-1.0, 0.0), o3 = vec2(0.0, 1.0), o4 = vec2(0.0, -1.0);
  v += step(0.99995, texture2D(tDepth, clamp(uSun + o0 * 0.006, 0.001, 0.999)).x);
  v += step(0.99995, texture2D(tDepth, clamp(uSun + o1 * 0.006, 0.001, 0.999)).x);
  v += step(0.99995, texture2D(tDepth, clamp(uSun + o2 * 0.006, 0.001, 0.999)).x);
  v += step(0.99995, texture2D(tDepth, clamp(uSun + o3 * 0.006, 0.001, 0.999)).x);
  v += step(0.99995, texture2D(tDepth, clamp(uSun + o4 * 0.006, 0.001, 0.999)).x);
  return v / 5.0 * uSunEdge;
}

vec3 godrays(vec2 uv, float vis, float selfSky){
  vec2 dv = uSun - uv;
  float dist = length(dv * vec2(uAspect, 1.0));
  vec2 stepv = dv / 16.0 * 0.92;
  vec2 p = uv + stepv * h12(uv * uRes + fract(uTime) * 91.0);
  float acc = 0.0, w = 1.0, ws = 0.0;
  for (int i = 0; i < 16; i++) {
    p += stepv;
    float sky = step(0.99995, texture2D(tDepth, p).x);
    acc += sky * w; ws += w; w *= 0.90;
  }
  acc /= ws;
  float fall = pow(clamp(1.0 - dist * 0.7, 0.0, 1.0), 1.6);
  return uSunCol * acc * fall * uRays * vis * (1.0 - selfSky);
}

vec3 lensflare(vec2 uv, float vis){
  vec2 ax = vec2(uAspect, 1.0);
  vec2 sp = uSun;
  vec3 f = vec3(0.0);
  float sx = abs(uv.x - sp.x) * uAspect, sy = abs(uv.y - sp.y);
  f += vec3(0.22, 0.45, 1.0) * exp(-sy * 140.0) * exp(-sx * 1.05) * 0.5;
  f += vec3(1.0, 0.78, 0.5) * exp(-sy * 300.0) * exp(-sx * 0.6) * 0.32;
  vec2 axis = vec2(0.5) - sp;
  for (int i = 0; i < 4; i++) {
    float fi = float(i);
    vec2 gp = sp + axis * (0.45 + fi * 0.55);
    float gd = length((uv - gp) * ax);
    float rad = 0.03 + fi * 0.02;
    float disc = smoothstep(rad, rad * 0.55, gd);
    float ring = smoothstep(rad, rad * 0.92, gd) * (1.0 - smoothstep(rad * 0.62, rad * 0.9, gd));
    vec3 tint = (i == 0) ? vec3(1.0, 0.62, 0.30) : (i == 1) ? vec3(0.35, 0.75, 1.0) : (i == 2) ? vec3(0.95, 0.5, 1.0) : vec3(0.5, 1.0, 0.7);
    f += tint * (disc * 0.035 + ring * 0.09);
  }
  float r = length((uv - sp) * ax);
  f += vec3(1.0, 0.82, 0.55) * smoothstep(0.2, 0.17, r) * smoothstep(0.12, 0.17, r) * 0.05;
  float cen = 1.0 - clamp(length((sp - 0.5) * ax) * 0.9, 0.0, 0.8);
  return f * uSunCol * uFlare * vis * cen;
}

void main(){
  vec2 uv = vUv;
  if (uWater > 0.0) uv += vec2(sin(uv.y * 24.0 + uTime * 2.1), cos(uv.x * 19.0 + uTime * 1.7)) * 0.0038 * uWater;
  vec2 dir = uv - 0.5;
  vec4 s0 = texture2D(tScene, uv);
  vec3 col = s0.rgb;
  if (uCA > 0.0001) {
    float ca = uCA * (0.25 + dot(dir, dir) * 3.2);
    col = vec3(texture2D(tScene, uv - dir * ca).r, s0.g, texture2D(tScene, uv + dir * ca).b);
  }
  float mask = s0.a;
  float dRaw = texture2D(tDepth, uv).x;

  if (uDof > 0.001) {
    float z = linZ(dRaw);
    float coc = clamp(abs(z - uFocusDist) / max(uFocusRange, 0.01), 0.0, 1.0) * uDof;
    vec3 b1 = texture2D(tBlurA, uv).rgb, b2 = texture2D(tBlurB, uv).rgb;
    vec3 bl = mix(b1, b2, smoothstep(0.45, 1.0, coc));
    col = mix(col, bl, smoothstep(0.02, 0.65, coc));
  }

  float vis = 0.0;
  if (uRays > 0.001 || uFlare > 0.001) vis = sunVisibility();
  if (uRays > 0.001) col += godrays(uv, max(vis, 0.25 * uSunEdge), step(0.99995, dRaw));

  vec3 bloom = max(texture2D(tBloom, uv).rgb - uBloomThresh, 0.0);
  col += bloom * uBloomTint * uBloom;
  if (uFlare > 0.001) col += lensflare(uv, vis);
  col += vec3(1.0, 0.9, 0.72) * uFlash;

  col *= mix(vec3(1.0), vec3(1.10, 1.03, 0.86), uWarm);
  vec2 q = vUv - 0.5; q.x *= mix(1.0, uAspect, 0.4);
  col *= 1.0 - uVig * smoothstep(0.22, 0.92, length(q) * 1.25);
  col *= uExposure;
  col = aces(col);
  col = pow(col, vec3(1.0 / 2.2));

  float l = lum(col);
  col = mix(vec3(l), col, uSat);
  col = (col - 0.5) * uContrast + 0.5;
  col = col * uGain + uLift;
  col += uShadowTint * (1.0 - smoothstep(0.0, 0.55, l)) + uHighTint * smoothstep(0.35, 1.0, l);

  if (uFocus > 0.001) {
    float m = clamp(mask + texture2D(tBlurA, uv).a * 0.5, 0.0, 1.0);
    float l2 = lum(col);
    vec3 ds = mix(vec3(l2), col, 0.10);
    ds = (ds - 0.5) * 1.14 + 0.5;
    ds *= vec3(0.92, 0.98, 1.06);
    col = mix(col, ds, uFocus * (1.0 - m));
    col = mix(col, col * vec3(1.07, 1.02, 0.93) + vec3(0.02, 0.012, 0.0), uFocus * m * 0.6);
  }

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

const FINAL_FS = GLSL_COMMON + `
uniform sampler2D tLdr; uniform vec2 uRes; uniform float uTime, uGrain, uAspect, uBars, uFade, uFxaa;
uniform vec3 uFadeCol;
varying vec2 vUv;
vec3 fxaa(vec2 uv){
  vec2 px = 1.0 / uRes;
  vec3 rgbNW = texture2D(tLdr, uv + vec2(-1., -1.) * px).xyz;
  vec3 rgbNE = texture2D(tLdr, uv + vec2( 1., -1.) * px).xyz;
  vec3 rgbSW = texture2D(tLdr, uv + vec2(-1.,  1.) * px).xyz;
  vec3 rgbSE = texture2D(tLdr, uv + vec2( 1.,  1.) * px).xyz;
  vec3 rgbM  = texture2D(tLdr, uv).xyz;
  vec3 lm = vec3(0.299, 0.587, 0.114);
  float lNW = dot(rgbNW, lm), lNE = dot(rgbNE, lm), lSW = dot(rgbSW, lm), lSE = dot(rgbSE, lm), lM = dot(rgbM, lm);
  float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE)));
  float lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
  vec2 d;
  d.x = -((lNW + lNE) - (lSW + lSE));
  d.y =  ((lNW + lSW) - (lNE + lSE));
  float dirReduce = max((lNW + lNE + lSW + lSE) * (0.25 * (1.0 / 8.0)), 1.0 / 128.0);
  float rcpDirMin = 1.0 / (min(abs(d.x), abs(d.y)) + dirReduce);
  d = min(vec2(8.0), max(vec2(-8.0), d * rcpDirMin)) * px;
  vec3 rgbA = 0.5 * (texture2D(tLdr, uv + d * (1.0 / 3.0 - 0.5)).xyz + texture2D(tLdr, uv + d * (2.0 / 3.0 - 0.5)).xyz);
  vec3 rgbB = rgbA * 0.5 + 0.25 * (texture2D(tLdr, uv + d * -0.5).xyz + texture2D(tLdr, uv + d * 0.5).xyz);
  float lB = dot(rgbB, lm);
  return (lB < lMin || lB > lMax) ? rgbA : rgbB;
}
void main(){
  vec3 col = uFxaa > 0.5 ? fxaa(vUv) : texture2D(tLdr, vUv).rgb;
  float t = fract(uTime * 0.37) * 100.0;
  float g = h12(vUv * uRes + t) + h12(vUv * uRes * 0.71 + t * 1.7) - 1.0;
  float l = lum(col);
  col += vec3(g * 0.9, g, g * 1.1) * uGrain * (0.35 + 0.9 * (1.0 - l) * (0.4 + l * 1.4));
  col += (h12(vUv * uRes + 17.0) - 0.5) / 255.0;
  float visH = mix(1.0, max(0.8, min(1.0, uAspect / 2.39)), uBars);   // schmale Bildschirme: Balken begrenzen
  float m = (1.0 - visH) * 0.5;
  float px = 1.0 / uRes.y;
  float bar = smoothstep(m + px, m - px, vUv.y) + smoothstep(1.0 - m - px, 1.0 - m + px, vUv.y);
  col *= 1.0 - clamp(bar, 0.0, 1.0);
  col = mix(col, uFadeCol, uFade);
  gl_FragColor = vec4(col, 1.0);
}`;

const QUALITY = {
  high: { maxPR: 1.5, scale: 1.0, shadow: 2048, levels: 6, fxaa: true, dof: true, rays: true, flare: true, ca: true },
  mid: { maxPR: 1.0, scale: 1.0, shadow: 1024, levels: 5, fxaa: true, dof: false, rays: true, flare: true, ca: true },
  low: { maxPR: 1.0, scale: 0.7, shadow: 0, levels: 4, fxaa: false, dof: false, rays: false, flare: false, ca: false },
};

class Post {
  constructor(renderer) {
    this.r = renderer;
    const gl2 = renderer.capabilities.isWebGL2;
    this.hdr = gl2 && (renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float'));
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
    this.quad = new THREE.Mesh(geo, null);
    this.quad.frustumCulled = false;
    this.pscene = new THREE.Scene();
    this.pscene.add(this.quad);
    this.pcam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const sm = (frag, uniforms) => new THREE.ShaderMaterial({ vertexShader: POST_VS, fragmentShader: frag, uniforms, depthTest: false, depthWrite: false });
    const V2 = () => ({ value: new THREE.Vector2() }), V3 = () => ({ value: new THREE.Vector3() });
    this.mDown = sm(DOWN_FS, { tSrc: { value: null }, uTexel: V2(), uKaris: { value: 0 } });
    this.mUp = sm(UP_FS, { tSrc: { value: null }, tBase: { value: null }, uTexel: V2(), uScatter: { value: 0.7 } });
    this.mComp = sm(COMP_FS, {
      tScene: { value: null }, tDepth: { value: null }, tBloom: { value: null }, tBlurA: { value: null }, tBlurB: { value: null },
      uRes: V2(), uTime: { value: 0 }, uNear: { value: 0.1 }, uFar: { value: 500 }, uAspect: { value: 1.78 },
      uExposure: { value: 1 }, uContrast: { value: 1 }, uSat: { value: 1 }, uBloom: { value: 0.1 }, uBloomThresh: { value: 0.06 },
      uBloomTint: V3(), uLift: V3(), uGain: V3(), uShadowTint: V3(), uHighTint: V3(),
      uVig: { value: 0.3 }, uCA: { value: 0.001 }, uWater: { value: 0 }, uFocus: { value: 0 }, uWarm: { value: 0 }, uFlash: { value: 0 },
      uDof: { value: 0 }, uFocusDist: { value: 5 }, uFocusRange: { value: 3 },
      uSun: V2(), uSunCol: V3(), uRays: { value: 0 }, uFlare: { value: 0 }, uSunEdge: { value: 0 },
    });
    this.mFinal = sm(FINAL_FS, {
      tLdr: { value: null }, uRes: V2(), uTime: { value: 0 }, uGrain: { value: 0.05 }, uAspect: { value: 1.78 },
      uBars: { value: 0 }, uFade: { value: 1 }, uFxaa: { value: 1 }, uFadeCol: V3(),
    });
    this.rts = null;
    this.q = QUALITY.high;
    this.levels = 6;
    this.w = 2; this.h = 2;
    this.sunUv = new THREE.Vector2(0.5, 0.5);
    this._v = new THREE.Vector3();
    this._sd = new THREE.Vector3();
  }
  setQuality(q) { this.q = q; this.levels = q.levels; if (this.w > 2) this.resize(this.w, this.h); }
  dispose() {
    if (!this.rts) return;
    const { scene, ldr, down, up } = this.rts;
    scene.dispose(); if (scene.depthTexture) scene.depthTexture.dispose(); ldr.dispose();
    down.forEach((t) => t.dispose()); up.forEach((t) => t && t.dispose());
    this.rts = null;
  }
  resize(w, h) {
    this.dispose();
    this.w = w; this.h = h;
    const type = this.hdr ? THREE.HalfFloatType : THREE.UnsignedByteType;
    const opt = { type, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false, generateMipmaps: false };
    const scene = new THREE.WebGLRenderTarget(w, h, Object.assign({}, opt, { depthBuffer: true }));
    scene.depthTexture = new THREE.DepthTexture(w, h);
    scene.depthTexture.type = THREE.UnsignedIntType;
    scene.depthTexture.minFilter = THREE.NearestFilter; scene.depthTexture.magFilter = THREE.NearestFilter;
    const ldr = new THREE.WebGLRenderTarget(w, h, Object.assign({}, opt, { type: THREE.UnsignedByteType }));
    const down = [], up = [];
    let cw = w, ch = h;
    for (let i = 0; i < this.levels; i++) {
      cw = Math.max(2, cw >> 1); ch = Math.max(2, ch >> 1);
      down.push(new THREE.WebGLRenderTarget(cw, ch, opt));
      up.push(i < this.levels - 1 ? new THREE.WebGLRenderTarget(cw, ch, opt) : null);
    }
    this.rts = { scene, ldr, down, up };
  }
  pass(mat, target) {
    this.quad.material = mat;
    this.r.setRenderTarget(target);
    this.r.render(this.pscene, this.pcam);
  }
  // fx: Atmo.cur + dynamische Effekte (G.fx)
  render(scene, camera, fx, dyn, time) {
    const r = this.r, rts = this.rts;
    // 1) Szene (HDR + Masken-Alpha + Tiefe)
    r.setRenderTarget(rts.scene);
    r.setClearColor(0x000000, 0);
    r.clear(true, true, true);
    r.render(scene, camera);

    // 2) Bloom-Kette
    const n = this.levels;
    this.mDown.uniforms.tSrc.value = rts.scene.texture;
    this.mDown.uniforms.uTexel.value.set(1 / this.w, 1 / this.h);
    this.mDown.uniforms.uKaris.value = 1;
    this.pass(this.mDown, rts.down[0]);
    this.mDown.uniforms.uKaris.value = 0;
    for (let i = 1; i < n; i++) {
      const src = rts.down[i - 1];
      this.mDown.uniforms.tSrc.value = src.texture;
      this.mDown.uniforms.uTexel.value.set(1 / src.width, 1 / src.height);
      this.pass(this.mDown, rts.down[i]);
    }
    let prev = rts.down[n - 1];
    for (let i = n - 2; i >= 0; i--) {
      this.mUp.uniforms.tSrc.value = prev.texture;
      this.mUp.uniforms.tBase.value = rts.down[i].texture;
      this.mUp.uniforms.uTexel.value.set(1 / prev.width, 1 / prev.height);
      this.mUp.uniforms.uScatter.value = 0.68;
      this.pass(this.mUp, rts.up[i]);
      prev = rts.up[i];
    }

// Instanziertes Mesh aus einer Geometrie + Liste {x,y,z,ry,s,sx,sy,sz,col}
function instanced(geo, mat, items, o = {}) {
  const im = new THREE.InstancedMesh(geo, mat, items.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3();

  items.forEach((it, i) => {

// Alles, was zu einer Welt gehört, wird hier registriert und später sauber entsorgt.
function disposeTree(root) {
  root.traverse((o) => {
    if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose();
    const ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of ms) {
      for (const k in m) { const v = m[k]; if (v && v.isTexture && !(v.userData && v.userData.shared)) v.dispose(); }
      if (m.uniforms) for (const k in m.uniforms) { const v = m.uniforms[k].value; if (v && v.isTexture && !(v.userData && v.userData.shared)) v.dispose(); }
      m.dispose();
    }
  });
}
